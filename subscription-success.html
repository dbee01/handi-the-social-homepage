<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Subscription – Handi Homepage</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; }
    .spinner { font-size: 2rem; margin: 20px; }
  </style>

  <!-- Matomo -->
  <script>
    var _paq = window._paq = window._paq || [];
    /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
    _paq.push(["setDocumentTitle", document.domain + "/" + document.title]);
    _paq.push(["disableCookies"]);
    _paq.push(['trackPageView']);
    _paq.push(['enableLinkTracking']);
    (function() {
      var u="https://handihomepage.matomo.cloud/";
      _paq.push(['setTrackerUrl', u+'matomo.php']);
      _paq.push(['setSiteId', '2']);
      var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
      g.async=true; g.src='https://cdn.matomo.cloud/handihomepage.matomo.cloud/matomo.js'; s.parentNode.insertBefore(g,s);
    })();
  </script>
  <noscript><p><img referrerpolicy="no-referrer-when-downgrade" src="https://handihomepage.matomo.cloud/matomo.php?idsite=2&amp;rec=1" style="border:0;" alt="" /></p></noscript>
  <!-- End Matomo Code -->

</head>
<body>
  <h2>📦 Setting up your subscription...</h2>
  <div class="spinner">⏳</div>
  <p id="status">Verifying payment...</p>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("session_id");
      if (!sessionId) {
        document.getElementById("status").innerText = "No session found. Please try again.";
        return;
      }
      try {
        const resp = await fetch("/api/stripe/session?session_id=" + sessionId);
        const data = await resp.json();
        if (data.subscription_id) {
          localStorage.setItem("stripe_subscription_id", data.subscription_id);
          document.getElementById("status").innerHTML =
            "✅ Subscription active! <a href='/'>Go to your dashboard</a>";
        } else {
          document.getElementById("status").innerText = "Could not verify payment.";
        }
      } catch (e) {
        document.getElementById("status").innerText = "Error verifying. Please refresh.";
      }
    })();
  </script>
</body>
</html>
