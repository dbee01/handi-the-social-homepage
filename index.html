<!DOCTYPE html>

    <!-- LOCKED DOWN CSS – overrides everything else -->
    <style>
        /* =========================================================
           ABSOLUTELY LOCKED HEADER – overrides all other CSS
           ========================================================= */
        header {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: space-between !important;
            flex-wrap: wrap !important;
            gap: 16px !important;
            padding: 12px 20px !important;
            background: #ffffff !important;
            border-bottom: 3px solid #0047cc !important;
        }

        .site-branding {
            flex: 0 0 auto !important;
            width: auto !important;
            order: 1 !important;
        }

        .nav-links {
            flex: 1 !important;
            display: flex !important;
            justify-content: center !important;
            order: 2 !important;
        }

        .search-wrapper {
            width: 100% !important;
            max-width: 500px !important;
            background: #ffffff !important;
            border: 2px solid #cbd5e1 !important;
            border-radius: 48px !important;
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            padding: 4px 8px 4px 20px !important;
            box-sizing: border-box !important;
        }

        .header-weather {
            flex: 0 0 auto !important;
            display: flex !important;
            align-items: center !important;
            justify-content: flex-end !important;
            gap: 8px !important;
            white-space: nowrap !important;
            order: 3 !important;
            background: #eaf2ff !important;
            padding: 8px 16px !important;
            border-radius: 48px !important;
        }

        #weather {
            display: inline-block !important;
            font-size: 1rem !important;
            font-weight: 500 !important;
            color: #1e1e1e !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .header-weather #weather {
            display: flex !important;
            flex-direction: row !important;
            gap: 12px !important;
            align-items: center !important;
        }

        .header-weather .weather-location,
        .header-weather .weather-temp,
        .header-weather .weather-outlook {
            display: inline-block !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Mobile: stack vertically */
        @media (max-width: 768px) {
            header {
                flex-direction: column !important;
                align-items: stretch !important;
            }
            .site-branding, .nav-links, .header-weather {
                width: 100% !important;
                justify-content: center !important;
            }
            .header-weather {
                margin-top: 8px !important;
            }
        }

        /* Small phones: wrap search inner elements */
        @media (max-width: 550px) {
            .search-wrapper {
                flex-wrap: wrap !important;
                border-radius: 28px !important;
                padding: 12px !important;
            }
            #searchInput { flex: 1 1 100% !important; order: 1 !important; }
            #searchEngine { flex: 1 !important; order: 2 !important; }
            #searchEngineLogo { order: 3 !important; }
            .search-button { order: 4 !important; width: 100% !important; border-radius: 40px !important; }
        }

        /* Dashboard grid – minimal */
        .dashboard-wrapper { padding: 20px; }
        #dashboard-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
    </style>

    <script src="/js/vendor/packery.pkgd.min.js"></script>
    <script src="/js/vendor/Sortable.min.js"></script>
</head>
<body>

<script src="js/core/message.js"></script>

<header>

    <div class="nav-links">

            <input type="text" id="searchInput" placeholder="Search privately...">

    <div class="header-weather">

</header>

    <main id="dashboard-grid">

        <div id="emergency" class="dashboard-item module"><div class="module-content"></div></div>
        <div id="phone" class="dashboard-item module"><div class="module-content"></div></div>

</div>

<div class="brand">

        <a href="https://handihomepage.com/terms">Terms of Service</a> |
        <a href="https://handihomepage.com/privacy">Privacy Policy</a>
    </span>
</div>

<!-- ========== MODULE INITIALISATION ========== -->
<script type="module">
    import { startWeatherUpdates } from './js/core/weather.js';
    import initBus from './modules/bus/bus.module.js';
    import initGallery from './modules/gallery/gallery.module.js';
    import initMusic from './modules/music/music.module.js';
    import initNews from './modules/news/news.module.js';
    import initMastodon from './modules/mastodon/mastodon.module.js';
    import initRadio from './modules/radio/radio.module.js';
    import initEmergency from './modules/emergency/emergency.module.js';
    import initPhone from './modules/friendly-phone/friendly-phone.module.js';
    import initChat from './modules/chat/chat.module.js';
    import initCalendar from './modules/calendar/calendar.module.js';
    import { initLayout } from './js/core/layout.js';

    // Initialize all modules
    const modules = {
        gallery: initGallery, bus: initBus, music: initMusic, news: initNews,
        mastodon: initMastodon, radio: initRadio, emergency: initEmergency,
        phone: initPhone, chat: initChat, calendar: initCalendar
    };
    for (const [id, initFn] of Object.entries(modules)) {
        const element = document.getElementById(id);
        if (element && element.querySelector('.module-content')) {
            try { initFn(element.querySelector('.module-content')); } catch(e) {}
        }
    }
    initLayout();
    startWeatherUpdates();

    // Search functionality (fallback)
    const searchInput = document.getElementById('searchInput');
    const searchEngine = document.getElementById('searchEngine');
    const searchBtn = document.getElementById('searchButton');
    if (searchInput && searchEngine && searchBtn) {
        const doSearch = () => {
            const q = searchInput.value.trim();
            if (!q) return;
            const urls = {
                startpage: `https://www.startpage.com/sp/search?query=${encodeURIComponent(q)}`,
                qwant: `https://www.qwant.com/?q=${encodeURIComponent(q)}`,
                ecosia: `https://www.ecosia.org/search?q=${encodeURIComponent(q)}`,
                mojeek: `https://www.mojeek.com/search?q=${encodeURIComponent(q)}`
            };
            window.open(urls[searchEngine.value] || urls.startpage, '_blank');
        };
        searchBtn.onclick = doSearch;
        searchInput.onkeypress = e => { if (e.key === 'Enter') doSearch(); };
    }
</script>

<script src="js/core/module-buttons.js"></script>
<script src="js/core/footer-controls.js"></script>
<script src="js/core/first-popup.js"></script>

<!-- ========== ONE TIME CLEANUP – removes disabled modules ========== -->
<script>
    window.addEventListener('load', function() {
        try {
            let s = localStorage.getItem('handiSettings');
            if (!s) return;
            let enabled = JSON.parse(s).enabledModules || {};
            let all = ['gallery','bus','music','news','mastodon','radio','emergency','phone','chat','calendar'];
            let keep = all.filter(id => enabled[id] === true);
            let grid = document.getElementById('dashboard-grid');
            if (!grid) return;
            for (let id of all) {
                if (!keep.includes(id)) {
                    let el = document.getElementById(id);
                    if (el && el.parentNode === grid) el.remove();
                }
            }
            if (enabled.weather === false) {
                let w = document.querySelector('.header-weather');
                if (w) w.style.display = 'none';
            }
            console.log('[Cleanup] Kept modules:', keep);
        } catch(e) {}
    });
</script>

<!-- ========== HEADER FIX – ensures correct order after all scripts ========== -->
<script>
    window.addEventListener('load', function() {
        const header = document.querySelector('header');
        const branding = document.querySelector('.site-branding');
        const navLinks = document.querySelector('.nav-links');
        const weather = document.querySelector('.header-weather');
        if (header && branding && navLinks && weather) {
            // Remove any inline styles that might have been added
            branding.style.cssText = '';
            navLinks.style.cssText = '';
            weather.style.cssText = '';
            // Ensure correct order
            header.appendChild(branding);
            header.appendChild(navLinks);
            header.appendChild(weather);
        }
    });
</script>

<!-- Fallback link to the dashboard selector -->
<div style="text-align: center; margin: 16px;">
    <a href="/selector.html" style="background: #0047cc; color: white; padding: 10px 20px; border-radius: 40px; text-decoration: none; font-weight: bold;">⚙️ Customize Dashboard</a>
</div>
<script>
    // First visit redirect to selector
    (function() {
        if (localStorage.getItem('handiPopupShown') === 'true') return;
        if (window.location.pathname.includes('/selector.html')) return;
        localStorage.setItem('handiPopupShown', 'true');
        window.location.href = '/selector.html';
    })();
</script>

<script>
    // Force dashboard to show only enabled modules
    (function() {
        function cleanup() {
            let s = localStorage.getItem('handiSettings');
            if (!s) return;
            let enabled = JSON.parse(s).enabledModules || {};
            let all = ['gallery','bus','music','news','mastodon','radio','emergency','phone','chat','calendar'];
            let keep = all.filter(id => enabled[id] === true);
            let grid = document.getElementById('dashboard-grid');
            if (!grid) return;
            for (let id of all) {
                if (!keep.includes(id)) {
                    let el = document.getElementById(id);
                    if (el && el.parentNode === grid) el.remove();
                }
            }
        }
        window.addEventListener('load', function() {
            setTimeout(cleanup, 100);
        });
    })();
</script>
