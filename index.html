<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ple.ie</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/packery@2.1.2/dist/packery.pkgd.min.js"></script>
  <script src="https://unpkg.com/sortablejs@1.15.0/Sortable.min.js"></script>
  <script type="module" src="app.js"></script>

  " src="js/dashboard.js"></script>
</head>
<body>

<header>
  <div class="brand">
    <i class="fa-solid fa-bolt"></i>
    <span>ple.ie</span>
  </div>
  <div class="search-wrapper">
    <select class="search-engine-select" id="searchEngine">
      <option value="google">Google</option>
      <option value="duckduckgo">DuckDuckGo</option>
      <option value="brave">Brave</option>
      <option value="proton">Proton</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search the network...">
    <i class="fa-solid fa-arrow-right" style="cursor: pointer;"></i>
  </div>
  <div class="header-weather">
    <i class="fa-solid fa-cloud-sun"></i>
    <span id="weather">Loading...</span>
  </div>
</header>

<div class="dashboard-wrapper">
  <main id="dashboard-grid">
    <!-- Module items - initially hidden -->
    <div class="dashboard-item" id="gallery" data-module="gallery" style="display: none;">
      <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
      <div class="module-content"></div>
    </div>
    <div class="dashboard-item" id="emergency" data-module="emergency" style="display: none;">
      <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
      <div class="module-content"></div>
    </div>
    <div class="dashboard-item" id="bus" data-module="bus" style="display: none;">
      <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
      <div class="module-content"></div>
    </div>
    <div class="dashboard-item" id="news" data-module="news" style="display: none;">
      <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
      <div class="module-content"></div>
    </div>
    <div class="dashboard-item" id="mastodon" data-module="mastodon" style="display: none;">
      <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
      <div class="module-content"></div>
    </div>
    <div class="dashboard-item" id="radio" data-module="radio" style="display: none;">
      <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
      <div class="module-content"></div>
    </div>
    <div class="dashboard-item" id="friendly-phone" data-module="friendly-phone" style="display: none;">
      <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
      <div class="module-content"></div>
    </div>
    <div class="dashboard-item" id="local-player" data-module="local-player" style="display: none;">
      <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
      <div class="module-content"></div>
    </div>
  </main>
</div>

<footer>
  <div class="footer-content">
    <span><i class="fa-solid fa-location-dot"></i> Dublin</span>
    <span><i class="fa-solid fa-leaf"></i> Green Energy</span>
    <span><i class="fa-brands fa-github"></i> Open Source</span>
    <span class="settings-link" onclick="window.location.href='settings.html'">
      <i class="fa-solid fa-gear"></i> Settings
    </span>
  </div>
</footer>

<!-- Floating Settings Button -->
<div class="floating-settings" onclick="window.location.href='settings.html'">
  <i class="fa-solid fa-gear"></i>
</div>

<script src="js/pins.js"></script>

<script type="module">
  import { loadSettings, getStorageInfo } from './js/storage.js';
  
  // Ensure modules are shown based on saved settings
  (function() {
    const settings = loadSettings();
    if (settings && settings.enabledModules) {
      Object.keys(settings.enabledModules).forEach(moduleId => {
        const element = document.getElementById(moduleId);
        if (element && settings.enabledModules[moduleId]) {
          element.style.display = 'block';
          element.classList.add('visible');
        }
      });
    }
  })();
  
  // Log storage info
  async function logStorageInfo() {
    const info = await getStorageInfo();
    console.log(`📦 Storage: ${info.images} images, ${info.music} music files`);
  }
  logStorageInfo();
</script>
<script>
// Load and apply saved module visibility
(function() {
  var saved = localStorage.getItem('pleie_settings');
  if (saved) {
    var settings = JSON.parse(saved);
    if (settings.enabledModules) {
      for (var moduleId in settings.enabledModules) {
        var element = document.getElementById(moduleId);
        if (element) {
          if (settings.enabledModules[moduleId]) {
            element.style.display = 'block';
            element.classList.add('visible');
          } else {
            element.style.display = 'none';
            element.classList.remove('visible');
          }
        }
      }
    }
  }
})();
</script>
</body>
</html>
</html>
