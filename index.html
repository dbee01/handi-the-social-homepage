<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ple.ie</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- PACKERY -->
  <script src="https://unpkg.com/packery@2.1.2/dist/packery.pkgd.min.js"></script>
  
  <!-- SORTABLEJS -->
  <script src="https://unpkg.com/sortablejs@1.15.0/Sortable.min.js"></script>
  
  <!-- YOUR APP - Load with defer to ensure DOM is ready -->
  <script type="module" src="app.js" defer></script>

  <style>
    /* Simple Refresh Modal */
    .refresh-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 20000;
      justify-content: center;
      align-items: center;
    }
    
    .refresh-modal.active {
      display: flex;
    }
    
    .refresh-modal-content {
      background: #1a1a2e;
      border: 2px solid #ffaa00;
      border-radius: 12px;
      padding: 25px;
      max-width: 350px;
      width: 85%;
      text-align: center;
    }
    
    .refresh-modal-icon {
      font-size: 3rem;
      color: #ffaa00;
      margin-bottom: 15px;
    }
    
    .refresh-modal-title {
      font-size: 1.3rem;
      color: #ffaa00;
      margin-bottom: 10px;
      font-weight: bold;
    }
    
    .refresh-modal-warning {
      background: rgba(255, 68, 68, 0.1);
      border-left: 3px solid #ff4444;
      padding: 10px;
      margin: 15px 0;
      color: #ff8888;
      font-size: 0.8rem;
      text-align: left;
    }
    
    .refresh-modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }
    
    .refresh-modal-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-family: monospace;
    }
    
    .refresh-modal-btn.primary {
      background: #00ff41;
      color: #000;
    }
    
    .refresh-modal-btn.danger {
      background: #ff4444;
      color: #fff;
    }
    
    .refresh-modal-checkbox {
      margin: 10px 0;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #888;
      font-size: 0.75rem;
    }
    
    /* Pin button styles */
    .pin-btn {
      touch-action: manipulation;
      cursor: pointer;
      min-width: 40px;
      min-height: 40px;
      transition: all 0.2s;
    }
    
    .pin-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <i class="fa-solid fa-bolt"></i>
    <span>ple.ie</span>
  </div>
  <div class="search-wrapper">
    <select class="search-engine-select" id="searchEngine">
      <option value="google">Google</option>
      <option value="duckduckgo">DuckDuckGo</option>
      <option value="brave">Brave</option>
      <option value="proton">Proton</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search the network...">
    <i class="fa-solid fa-arrow-right" style="cursor: pointer;"></i>
  </div>
  <div class="header-weather">
    <i class="fa-solid fa-cloud-sun"></i>
    <span id="weather">Loading...</span>
  </div>
</header>

<div class="dashboard-wrapper" style="flex: 1;">
  <main id="dashboard-grid">

    <!-- Gallery Module -->
    <div class="dashboard-item" id="gallery" data-order="1">
      <button class="pin-btn" title="Pin to top"><i class="fa-solid fa-thumbtack"></i></button>
    </div>

    <!-- Emergency Module -->
    <div class="dashboard-item" id="emergency" data-order="2">
      <button class="pin-btn" title="Pin to top"><i class="fa-solid fa-thumbtack"></i></button>
    </div>
    
    <!-- Bus Module -->
    <div class="dashboard-item" id="bus" data-order="3">
      <button class="pin-btn" title="Pin to top"><i class="fa-solid fa-thumbtack"></i></button>
    </div>

    <!-- Friendly Phone Module -->
    <div class="dashboard-item" id="friendly-phone" data-order="11">
      <button class="pin-btn" title="Pin to top"><i class="fa-solid fa-thumbtack"></i></button>
    </div>
    
    <!-- Local Music Player Module -->
    <div class="dashboard-item" id="local-player" data-order="12">
      <button class="pin-btn" title="Pin to top">
        <i class="fa-solid fa-thumbtack"></i>
      </button>
      <div id="music-player" class="module-content"></div>
    </div>

  </main>
</div>

<footer>
  <div class="footer-content">
    <span><i class="fa-solid fa-location-dot"></i> Dublin</span>
    <span><i class="fa-solid fa-leaf"></i> Green Energy</span>
    <span><i class="fa-brands fa-github"></i> Open Source</span>
  </div>
</footer>

<!-- Simple Refresh Modal -->
<div id="refreshModal" class="refresh-modal">
  <div class="refresh-modal-content">
    <div class="refresh-modal-icon">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <div class="refresh-modal-title">Refresh Page?</div>
    <div class="refresh-modal-warning">
      <i class="fa-solid fa-database"></i> Playing media will stop<br>
      <i class="fa-solid fa-image"></i> Slideshow position will reset
    </div>
    <div class="refresh-modal-checkbox">
      <input type="checkbox" id="dontShowAgain">
      <label>Don't show again this session</label>
    </div>
    <div class="refresh-modal-buttons">
      <button id="stayBtn" class="refresh-modal-btn primary">Stay</button>
      <button id="refreshBtn" class="refresh-modal-btn danger">Refresh</button>
    </div>
  </div>
</div>

<script>
// ========== SIMPLE REFRESH WARNING (Works on all browsers) ==========
(function() {
  let warningsEnabled = true;
  let confirmedRefresh = false;
  
  const modal = document.getElementById('refreshModal');
  const stayBtn = document.getElementById('stayBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const dontShowCheckbox = document.getElementById('dontShowAgain');
  
  // Load preference
  if (sessionStorage.getItem('refreshWarningsOff') === 'true') {
    warningsEnabled = false;
  }
  
  function showModal(callback) {
    if (!warningsEnabled || confirmedRefresh) {
      if (callback) callback();
      return;
    }
    
    modal.classList.add('active');
    window.pendingRefresh = callback;
  }
  
  function hideModal() {
    modal.classList.remove('active');
    window.pendingRefresh = null;
  }
  
  stayBtn.onclick = () => {
    hideModal();
  };
  
  refreshBtn.onclick = () => {
    if (dontShowCheckbox.checked) {
      warningsEnabled = false;
      sessionStorage.setItem('refreshWarningsOff', 'true');
    }
    hideModal();
    confirmedRefresh = true;
    
    if (window.pendingRefresh) {
      window.pendingRefresh();
    } else {
      location.reload();
    }
  };
  
  modal.onclick = (e) => {
    if (e.target === modal) hideModal();
  };
  
  // Catch keyboard refresh
  document.addEventListener('keydown', (e) => {
    if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || (e.metaKey && e.key === 'r')) {
      e.preventDefault();
      showModal(() => location.reload());
    }
  });
  
  // Catch browser refresh button
  window.addEventListener('beforeunload', (e) => {
    if (warningsEnabled && !confirmedRefresh) {
      e.preventDefault();
      e.returnValue = '';
      showModal(() => location.reload());
      return e.returnValue;
    }
  });
  
  // Override reload
  const originalReload = location.reload;
  location.reload = function() {
    if (warningsEnabled && !confirmedRefresh) {
      showModal(() => originalReload.call(location));
    } else {
      originalReload.call(location);
    }
  };
  
  // Console helpers
  window.disableRefreshWarnings = () => {
    warningsEnabled = false;
    sessionStorage.setItem('refreshWarningsOff', 'true');
  };
  window.enableRefreshWarnings = () => {
    warningsEnabled = true;
    sessionStorage.removeItem('refreshWarningsOff');
  };
  
  console.log('✅ Refresh protection active');
})();

// ========== PIN FEATURE ==========
(function() {
  function savePins() {
    const pinned = Array.from(document.querySelectorAll('.dashboard-item.pinned')).map(i => i.id);
    localStorage.setItem('pinnedItems', JSON.stringify(pinned));
  }
  
  function loadPins() {
    const saved = localStorage.getItem('pinnedItems');
    if (saved) {
      JSON.parse(saved).forEach(id => {
        const item = document.getElementById(id);
        if (item) {
          item.classList.add('pinned');
          const btn = item.querySelector('.pin-btn');
          if (btn) {
            btn.style.color = '#00ff41';
            btn.style.transform = 'rotate(45deg)';
          }
        }
      });
    }
  }
  
  function movePinsToTop() {
    const grid = document.getElementById('dashboard-grid');
    const items = Array.from(grid.children);
    const pinned = items.filter(i => i.classList.contains('pinned'));
    const unpinned = items.filter(i => !i.classList.contains('pinned'));
    pinned.forEach(i => grid.appendChild(i));
    unpinned.forEach(i => grid.appendChild(i));
  }
  
  function initPins() {
    document.querySelectorAll('.pin-btn').forEach(btn => {
      const newBtn = btn.cloneNode(true);
      btn.parentNode.replaceChild(newBtn, btn);
      
      newBtn.onclick = (e) => {
        e.stopPropagation();
        const item = newBtn.closest('.dashboard-item');
        if (item.classList.contains('pinned')) {
          item.classList.remove('pinned');
          newBtn.style.color = '';
          newBtn.style.transform = '';
        } else {
          item.classList.add('pinned');
          newBtn.style.color = '#00ff41';
          newBtn.style.transform = 'rotate(45deg)';
        }
        movePinsToTop();
        savePins();
        
        if (window.pckry) {
          window.pckry.reloadItems();
          window.pckry.layout();
        }
      };
    });
  }
  
  loadPins();
  initPins();
  setTimeout(movePinsToTop, 100);
  
  console.log('✅ Pin feature active');
})();
</script>

</body>
</html>
