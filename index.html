<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <meta
            http-equiv="Cache-Control"
            content="no-cache, no-store, must-revalidate"
        />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <title>HandiHomepage – Senior Dashboard</title>
        <link rel="icon" type="image/x-icon" href="/images/favicon.png" />
        <link rel="stylesheet" href="/css/vendor/fa-7.2.0/css/all.min.css" />
        <link rel="stylesheet" href="/css/main.css" />
        <link rel="stylesheet" href="/css/elderly.css" />

        <link rel="manifest" href="/manifest.json" />
        <meta name="theme-color" content="#0047cc" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="HandiHome" />
        <link rel="apple-touch-icon" href="/images/favicon.png" />

        <!-- Privacy-friendly analytics by Plausible (third-party only) -->
        <script>
            // Only enable Plausible for third-party users (not the developer)
            if (
                window.location.hostname !== "localhost" &&
                window.location.hostname !== "127.0.0.1" &&
                !window.location.hostname.startsWith("192.168.") &&
                !window.location.hostname.startsWith("10.")
            ) {
                if (localStorage.getItem("plausible_ignore") !== "true") {
                    document.write(
                        '<script async src="https://plausible.io/js/pa-9hIAZWciwh0HAPpXKcKMy.js"><\/script>',
                    );
                    ((window.plausible =
                        window.plausible ||
                        function () {
                            (plausible.q = plausible.q || []).push(arguments);
                        }),
                        (plausible.init =
                            plausible.init ||
                            function (i) {
                                plausible.o = i || {};
                            }));
                    plausible.init();
                }
            }
        </script>

        <style>
            header {
                display: flex !important;
                flex-direction: row !important;
                align-items: center !important;
                justify-content: space-between !important;
                flex-wrap: wrap !important;
                gap: 16px !important;
                padding: 12px 20px !important;
                background: #ffffff !important;
                border-bottom: 3px solid #0047cc !important;
            }

            .site-branding {
                flex: 0 0 auto !important;
                width: auto !important;
                order: 1 !important;
            }

            .nav-links {
                flex: 1 !important;
                display: flex !important;
                justify-content: center !important;
                order: 2 !important;
            }

            .search-wrapper {
                width: 100% !important;
                max-width: 500px !important;
                background: #ffffff !important;
                border: 2px solid #cbd5e1 !important;
                border-radius: 48px !important;
                display: flex !important;
                align-items: center !important;
                gap: 8px !important;
                padding: 4px 8px 4px 20px !important;
                box-sizing: border-box !important;
            }

            .header-weather {
                flex: 0 0 auto !important;
                display: flex !important;
                align-items: center !important;
                justify-content: flex-end !important;
                gap: 8px !important;
                white-space: nowrap !important;
                order: 3 !important;
                background: #eaf2ff !important;
                padding: 8px 16px !important;
                border-radius: 48px !important;
            }

            #weather {
                display: inline-block !important;
                font-size: 1rem !important;
                font-weight: 500 !important;
                color: #1e1e1e !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .dashboard-wrapper {
                padding: 20px;
            }
            #dashboard-grid {
                display: flex;
                flex-wrap: wrap;
                gap: 20px;
            }

            footer {
                margin-top: 80px;
            }

            .brand {
                margin-top: 20px;
                margin-bottom: 20px;
            }

            /* Force customize button to show */
            .customize-link {
                text-align: center;
                margin-bottom: 160px;
                display: block !important;
            }

            .customize-link a {
                display: inline-block !important;
                background: #0047cc !important;
                color: white !important;
                padding: 12px 28px !important;
                border-radius: 50px !important;
                text-decoration: none !important;
                font-weight: bold !important;
                font-size: 18px !important;
                border: none !important;
                cursor: pointer !important;
                visibility: visible !important;
                opacity: 1 !important;
            }

            .customize-link a:hover {
                background: #0033aa !important;
            }
        </style>

        <script src="/js/vendor/packery.pkgd.min.js"></script>
        <script src="/js/vendor/Sortable.min.js"></script>
    </head>
    <body>
        <script src="js/core/message.js"></script>

        <header>
            <div class="site-branding">
                <div class="handi-logo">
                    <a href="/" class="logo-link">
                        <i class="fa-solid fa-hand-peace"></i>
                        <span class="logo-text">HandiHomepage</span>
                    </a>
                </div>
            </div>
            <div class="nav-links">
                <div class="search-wrapper">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search privately..."
                    />
                    <select id="searchEngine">
                        <option value="startpage">Startpage</option>
                        <option value="qwant">Qwant</option>
                        <option value="ecosia">Ecosia</option>
                        <option value="mojeek">Mojeek</option>
                    </select>
                    <img
                        id="searchEngineLogo"
                        src="/images/startpage.jpg"
                        alt="Startpage"
                    />
                    <button id="searchButton" class="search-button">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
            <div class="header-weather">
                <i class="fa-solid fa-cloud-sun"></i>
                <span id="weather">🌤️ --°C</span>
            </div>
        </header>

        <div class="dashboard-wrapper">
            <main id="dashboard-grid">
                <!-- FREE modules - weather module removed -->
                <div id="gallery" class="dashboard-item module">
                    <div class="module-content"></div>
                </div>
                <div id="music" class="dashboard-item module">
                    <div class="module-content"></div>
                </div>
                <div id="news" class="dashboard-item module">
                    <div class="module-content"></div>
                </div>
                <div id="calendar" class="dashboard-item module">
                    <div class="module-content"></div>
                </div>
                <div id="chat" class="dashboard-item module">
                    <div class="module-content"></div>
                </div>
                <div id="social" class="dashboard-item module">
                    <div class="module-content"></div>
                </div>
                <div id="radio" class="dashboard-item module">
                    <div class="module-content"></div>
                </div>
                <div id="phone" class="dashboard-item module">
                    <div class="module-content"></div>
                </div>

                <!-- PREMIUM MODULES -->
                <div id="live_bus" class="dashboard-item module">
                    <div class="module-content"></div>
                </div>
                <div id="webrtc" class="dashboard-item module">
                    <div class="module-content"></div>
                </div>
                <div id="emergency_alert" class="dashboard-item module">
                    <div class="module-content"></div>
                </div>
            </main>
        </div>

        <footer>
            <div class="footer-bar">
                <button id="footerMuteBtn" class="footer-icon">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <button id="footerWakeLockBtn" class="footer-icon">
                    <i class="fa-solid fa-bed"></i>
                </button>
                <button id="footerDocsBtn" class="footer-icon">
                    <i class="fa-solid fa-question"></i>
                </button>
                <button id="footerCoffeeBtn" class="footer-icon">
                    <i class="fa-solid fa-beer"></i>
                </button>
                <button id="footerEmailBtn" class="footer-icon">
                    <i class="fa-solid fa-at"></i>
                </button>
                <button id="footerSettingsBtn" class="footer-icon">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </footer>

        <div class="brand">
            <span class="subtitle">
                <a href="https://handihomepage.com/terms">Terms of Service</a> |
                <a href="https://handihomepage.com/privacy">Privacy Policy</a>
            </span>
        </div>

        <div class="customize-link">
            <a href="/selector.html">⚙️ Customize Dashboard</a>
        </div>

        <!-- ========== MODULE INITIALISATION ========== -->
        <script type="module">
            import { startWeatherUpdates } from "./js/core/weather.js";
            import initGallery from "./modules/gallery/gallery.module.js";
            import initMusic from "./modules/music/music.module.js";
            import initChat from "./modules/chat/chat.module.js";
            import initNews from "./modules/news/news.module.js";
            import initSocial from "./modules/mastodon/mastodon.module.js";
            import initCalendar from "./modules/calendar/calendar.module.js";
            import initBus from "./modules/bus/bus.module.js";
            import initRadio from "./modules/radio/radio.module.js";
            import initPhone from "./modules/friendly-phone/friendly-phone.module.js";

            import initWebRTC from "./modules/webrtc/webrtc.module.js";
            import initEmergency from "./modules/emergency/emergency.module.js";
            import { initLayout } from "./js/core/layout.js";

            // Initialize all modules - weather module removed
            const modules = {
                gallery: initGallery,
                music: initMusic,
                news: initNews,
                calendar: initCalendar,
                phone: initPhone,
                live_bus: initBus,
                webrtc: initWebRTC,
                chat: initChat,
                social: initSocial,
                radio: initRadio,
                emergency_alert: initEmergency,
            };

            for (const [id, initFn] of Object.entries(modules)) {
                const element = document.getElementById(id);
                if (element && element.querySelector(".module-content")) {
                    try {
                        initFn(element.querySelector(".module-content"));
                        console.log(`✅ Initialized: ${id}`);
                    } catch (e) {
                        console.error(`❌ Failed to init ${id}:`, e);
                    }
                } else {
                    console.warn(`⚠️ Element not found: ${id}`);
                }
            }

            // Initialize weather in header only
            try {
                const weatherElement = document.getElementById("weather");
                if (weatherElement) startWeatherUpdates();
            } catch (e) {
                console.error("Weather init failed:", e);
            }

            initLayout();

            // Search functionality
            const searchInput = document.getElementById("searchInput");
            const searchEngine = document.getElementById("searchEngine");
            const searchBtn = document.getElementById("searchButton");
            if (searchInput && searchEngine && searchBtn) {
                const doSearch = () => {
                    const q = searchInput.value.trim();
                    if (!q) return;
                    const urls = {
                        startpage: `https://www.startpage.com/sp/search?query=${encodeURIComponent(q)}`,
                        qwant: `https://www.qwant.com/?q=${encodeURIComponent(q)}`,
                        ecosia: `https://www.ecosia.org/search?q=${encodeURIComponent(q)}`,
                        mojeek: `https://www.mojeek.com/search?q=${encodeURIComponent(q)}`,
                    };
                    window.open(
                        urls[searchEngine.value] || urls.startpage,
                        "_blank",
                    );
                };
                searchBtn.onclick = doSearch;
                searchInput.onkeypress = (e) => {
                    if (e.key === "Enter") doSearch();
                };
            }
        </script>

        <script src="js/core/module-buttons.js"></script>
        <script src="js/core/footer-controls.js"></script>

        <!-- ========== CLEANUP – shows/hides modules based on localStorage ========== -->
        <script>
            window.addEventListener("load", function () {
                setTimeout(function () {
                    try {
                        let s = localStorage.getItem("handiSettings");
                        if (!s) return;
                        let enabled = JSON.parse(s).enabledModules || {};

                        // All possible modules - weather module removed from grid
                        let allModules = [
                            "gallery",
                            "music",
                            "radio",
                            "news",
                            "social",
                            "calendar",
                            "chat",
                            "phone",
                            "live_bus",
                            "webrtc",
                            "emergency_alert",
                        ];

                        let grid = document.getElementById("dashboard-grid");
                        if (!grid) return;

                        for (let id of allModules) {
                            let el = document.getElementById(id);
                            if (el && enabled[id] !== true) {
                                if (el.parentNode === grid) el.remove();
                                console.log(`Removed: ${id}`);
                            } else if (el && enabled[id] === true) {
                                console.log(`Keeping: ${id}`);
                            }
                        }
                    } catch (e) {
                        console.error("Cleanup error:", e);
                    }
                }, 100);
            });
        </script>

        <script>
            // First visit redirect
            (function () {
                if (localStorage.getItem("handiPopupShown") === "true") return;
                if (window.location.pathname.includes("/selector.html")) return;
                localStorage.setItem("handiPopupShown", "true");
                window.location.href = "/selector.html";
            })();
        </script>
    </body>
</html>
