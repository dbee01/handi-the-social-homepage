<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Elderly Theme by Handi Homepage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://unpkg.com/packery@2.1.2/dist/packery.pkgd.min.js"></script>
    <script src="https://unpkg.com/sortablejs@1.15.0/Sortable.min.js"></script>
    <script type="module" src="./js/pins.js"></script>
    <script type="module">
        import { loadSettings } from './js/core/settings.js';
        import initBus from './modules/bus/bus.module.js';
        import initGallery from './modules/gallery/gallery.module.js';
        import initMusic from './modules/local-player/local-player.module.js';
        import initNews from './modules/news/news.module.js';
        import initMastodon from './modules/mastodon/mastodon.module.js';
        import initRadio from './modules/radio/radio.module.js';
        import initEmergency from './modules/emergency/emergency.module.js';
        import initPhone from './modules/friendly-phone/friendly-phone.module.js';

        import { initLayout } from './js/core/layout.js';

        initLayout();

        const modules = {
            gallery: initGallery,
            bus: initBus,
            music: initMusic,
            news: initNews,
            mastodon: initMastodon,
            radio: initRadio,
            emergency: initEmergency,
            phone: initPhone
        };

        const settings = loadSettings();
        const enabledModules = settings.enabledModules || {};

        // Show/hide and initialise modules
        for (const [id, initFn] of Object.entries(modules)) {
            const element = document.getElementById(id);
            if (!element) continue;
            const isEnabled = enabledModules[id] !== false;
            element.classList.toggle('hidden', !isEnabled);
            if (isEnabled) {
                const container = element.querySelector('.module-content');
                if (container) {
                    try {
                        initFn(container);
                    } catch (err) {
                        console.error(`Error initialising ${id}:`, err);
                    }
                }
            }
        }
        
        // ----- Search functionality (European privacy‑friendly engines) -----
        function initializeSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchEngine = document.getElementById('searchEngine');
            const searchEngineLogo = document.getElementById('searchEngineLogo');

            if (!searchInput || !searchEngine || !searchEngineLogo) {
                console.warn("Search elements not found");
                return;
            }

            function updateSearchLogo(value) {
                const logoMap = {
                    startpage: { label: 'SP', className: 'logo-startpage' },
                    qwant: { label: 'Q', className: 'logo-qwant' },
                    ecosia: { label: 'E', className: 'logo-ecosia' },
                    mojeek: { label: 'M', className: 'logo-mojeek' }
                };
                const engine = logoMap[value] || logoMap.startpage;
                searchEngineLogo.className = `search-engine-logo ${engine.className}`;
                searchEngineLogo.textContent = engine.label;
                searchEngineLogo.title = searchEngine.options[searchEngine.selectedIndex]?.text || 'Search engine';
            }

            updateSearchLogo(searchEngine.value);
            searchEngine.addEventListener('change', () => updateSearchLogo(searchEngine.value));

            function performSearch() {
                const query = searchInput.value.trim();
                if (!query) return;

                const engine = searchEngine.value;
                let searchUrl = '';

                switch (engine) {
                    case 'startpage':
                        searchUrl = `https://www.startpage.com/sp/search?query=${encodeURIComponent(query)}`;
                        break;
                    case 'qwant':
                        searchUrl = `https://www.qwant.com/?q=${encodeURIComponent(query)}`;
                        break;
                    case 'ecosia':
                        searchUrl = `https://www.ecosia.org/search?q=${encodeURIComponent(query)}`;
                        break;
                    case 'mojeek':
                        searchUrl = `https://www.mojeek.com/search?q=${encodeURIComponent(query)}`;
                        break;
                    default:
                        searchUrl = `https://www.startpage.com/sp/search?query=${encodeURIComponent(query)}`;
                }

                window.open(searchUrl, '_blank');
                searchInput.value = '';
            }

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });

            const searchIcon = document.querySelector('.search-wrapper i.fa-arrow-right');
            if (searchIcon) {
                searchIcon.addEventListener('click', performSearch);
            }
        }

        // Call it after modules are initialised
        initializeSearch();

        // Weather widget
        async function updateWeather() {
            const weatherEl = document.getElementById('weather');
            if (!weatherEl) return;

            // Latitude/longitude for Dublin city centre (or use your exact coordinates)
            const lat = 51.8985;
            const lon = 8.4756;
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data.current_weather) {
                    const temp = Math.round(data.current_weather.temperature);
                    const weatherCode = data.current_weather.weathercode;
                    const outlook = getWeatherDescription(weatherCode);

                    // Build HTML: location, temperature, outlook
                    weatherEl.innerHTML = `
                        <div class="weather-location">📍 Cork City</div>
                        <div class="weather-temp">🌡️ ${temp}°C</div>
                        <div class="weather-outlook">${outlook}</div>
                    `;
                } else {
                    weatherEl.innerHTML = `<div class="weather-fallback">🌤️ --°C</div>`;
                }
            } catch (err) {
                console.warn("Weather fetch failed:", err);
                weatherEl.innerHTML = `<div class="weather-fallback">🌤️ --°C</div>`;
            }
        }

        // Helper: map WMO weather codes to human‑readable outlook
        function getWeatherDescription(code) {
            const codes = {
                0: "☀️ Clear sky",
                1: "🌤️ Mainly clear",
                2: "⛅ Partly cloudy",
                3: "☁️ Overcast",
                45: "🌫️ Fog",
                48: "🌫️ Depositing rime fog",
                51: "🌧️ Light drizzle",
                53: "🌧️ Moderate drizzle",
                55: "🌧️ Dense drizzle",
                56: "🌧️ Freezing drizzle",
                57: "🌧️ Heavy freezing drizzle",
                61: "🌧️ Slight rain",
                63: "🌧️ Moderate rain",
                65: "🌧️ Heavy rain",
                66: "🌨️ Freezing rain",
                67: "🌨️ Heavy freezing rain",
                71: "🌨️ Slight snow",
                73: "🌨️ Moderate snow",
                75: "🌨️ Heavy snow",
                77: "🌨️ Snow grains",
                80: "🌧️ Slight rain showers",
                81: "🌧️ Moderate rain showers",
                82: "🌧️ Violent rain showers",
                85: "🌨️ Slight snow showers",
                86: "🌨️ Heavy snow showers",
                95: "⛈️ Thunderstorm",
                96: "⛈️ Thunderstorm with hail",
                99: "⛈️ Heavy thunderstorm with hail"
            };
            return codes[code] || "🌡️ Unknown";
        }
        updateWeather();
        setInterval(updateWeather, 1800000);

        // Settings link
        document.getElementById('settingsLink')?.addEventListener('click', () => {
            window.location.href = 'settings.html';
        });
        
    </script>
</head>
<body>
    <header>
      <div class="brand"><i class="fa-solid fa-bolt"></i>&nbsp;</div>
      <div class="search-wrapper">
          <span class="search-engine-logo logo-startpage" id="searchEngineLogo" title="StartPage">SP</span>
          <select id="searchEngine" class="search-engine-select">
              <option value="startpage">StartPage</option>
              <option value="qwant">Qwant</option>
              <option value="ecosia">Ecosia</option>
              <option value="mojeek">Mojeek</option>
          </select>
          <input type="text" id="searchInput" placeholder="Safe search">
          <i class="fa-solid fa-arrow-right"></i>
      </div>
        <div class="header-weather">
            <i class="fa-solid fa-cloud-sun"></i>
            <span id="weather">🌤️ --°C</span>
        </div>
    </header>

    <div class="dashboard-wrapper">
        <main id="dashboard-grid">
            <div id="gallery" class="dashboard-item module" data-module="gallery">
                <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
                <div class="module-content"></div>
            </div>
            <div id="bus" class="dashboard-item module" data-module="bus">
                <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
                <div class="module-content"></div>
            </div>
            <div id="music" class="dashboard-item module" data-module="music">
                <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
                <div class="module-content"></div>
            </div>
            <div id="news" class="dashboard-item module" data-module="news">
                <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
                <div class="module-content"></div>
            </div>
            <div id="mastodon" class="dashboard-item module" data-module="mastodon">
                <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
                <div class="module-content"></div>
            </div>
            <div id="radio" class="dashboard-item module" data-module="radio">
                <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
                <div class="module-content"></div>
            </div>
            <div id="emergency" class="dashboard-item module" data-module="emergency">
                <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
                <div class="module-content"></div>
            </div>
            <div id="phone" class="dashboard-item module" data-module="phone">
                <button class="pin-btn"><i class="fa-solid fa-thumbtack"></i></button>
                <div class="module-content"></div>
            </div>
        </main>
    </div>

    <footer>
        <div class="footer-content">
            <span><i class="fa-solid fa-location-dot"></i> Europe</span>
            <span><i class="fa-solid fa-leaf"></i> Green Energy</span>
            <span><i class="fa-brands fa-github"></i> Open Source</span>
            <span class="settings-link" id="settingsLink"><i class="fa-solid fa-gear"></i> Settings</span>
        </div>
    </footer>

    <!-- <script type="module">
        import { initThemeSwitcher } from './js/core/theme-switcher.js';
        initThemeSwitcher();
    </script> --> 
</body>
</html>
