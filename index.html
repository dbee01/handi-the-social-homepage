        <!-- Privacy-friendly analytics by Plausible (third-party only) -->

            // Only enable Plausible for third-party users (not the developer)
            if (
                window.location.hostname !== "localhost" &&
                window.location.hostname !== "127.0.0.1" &&
                !window.location.hostname.startsWith("192.168.") &&
                !window.location.hostname.startsWith("10.")

                if (localStorage.getItem("plausible_ignore") !== "true") {
                    document.write(
                        '<script async src="https://plausible.io/js/pa-9hIAZWciwh0HAPpXKcKMy.js"><\/script>',
                    );
                    ((window.plausible =
                        window.plausible ||
                        function () {
                            (plausible.q = plausible.q || []).push(arguments);
                        }),
                        (plausible.init =
                            plausible.init ||
                            function (i) {
                                plausible.o = i || {};
                            }));
                    plausible.init();
                }
            }
        </script>

                font-weight: bold !important;

                cursor: pointer !important;

            /* Mobile header breakpoint */

                    text-align: center !important;
                }
                .site-branding {
                    text-align: center !important;

                    width: 100% !important;
                }

                    max-width: 100% !important;

                .header-weather {

                    width: auto !important;
                }
            }

        <!-- ========== MODULE INITIALISATION ========== -->
        <script type="module">
            import { startWeatherUpdates } from "./js/core/weather.js";
            import initGallery from "./modules/gallery/gallery.module.js";
            import initMusic from "./modules/music/music.module.js";
            import initChat from "./modules/chat/chat.module.js";
            import initNews from "./modules/news/news.module.js";
            import initSocial from "./modules/mastodon/mastodon.module.js";
            import initCalendar from "./modules/calendar/calendar.module.js";
            import initBus from "./modules/bus/bus.module.js";
            import initRadio from "./modules/radio/radio.module.js";
            import initPhone from "./modules/friendly-phone/friendly-phone.module.js";

            import initWebRTC from "./modules/webrtc/webrtc.module.js";
            import initEmergency from "./modules/emergency/emergency.module.js";
            import initClickToCall from "./modules/click-to-call/click-to-call.module.js";
            import { initLayout } from "./js/core/layout.js";

            // Initialize all modules - weather module removed
            const modules = {
                gallery: initGallery,
                music: initMusic,
                news: initNews,
                calendar: initCalendar,
                phone: initPhone,
                live_bus: initBus,
                webrtc: initWebRTC,
                chat: initChat,
                social: initSocial,
                radio: initRadio,
                emergency_alert: initEmergency,
                click_to_call: initClickToCall,
            };

            for (const [id, initFn] of Object.entries(modules)) {
                const element = document.getElementById(id);
                if (element && element.querySelector(".module-content")) {
                    try {
                        initFn(element.querySelector(".module-content"));
                        console.log(`✅ Initialized: ${id}`);
                    } catch (e) {
                        console.error(`❌ Failed to init ${id}:`, e);
                    }
                } else {
                    console.warn(`⚠️ Element not found: ${id}`);
                }
            }

            // Initialize weather in header only
            try {
                const weatherElement = document.getElementById("weather");
                if (weatherElement) startWeatherUpdates();
            } catch (e) {
                console.error("Weather init failed:", e);
            }

            initLayout();

            // Search functionality
            const searchInput = document.getElementById("searchInput");
            const searchEngine = document.getElementById("searchEngine");
            const searchBtn = document.getElementById("searchButton");
            if (searchInput && searchEngine && searchBtn) {
                const doSearch = () => {
                    const q = searchInput.value.trim();
                    if (!q) return;
                    const urls = {
                        startpage: `https://www.startpage.com/sp/search?query=${encodeURIComponent(q)}`,
                        qwant: `https://www.qwant.com/?q=${encodeURIComponent(q)}`,
                        ecosia: `https://www.ecosia.org/search?q=${encodeURIComponent(q)}`,
                        mojeek: `https://www.mojeek.com/search?q=${encodeURIComponent(q)}`,
                    };
                    window.open(
                        urls[searchEngine.value] || urls.startpage,
                        "_blank",
                    );
                };
                searchBtn.onclick = doSearch;
                searchInput.onkeypress = (e) => {
                    if (e.key === "Enter") doSearch();
                };
            }

            // ========== GLOBAL TEST: alertTrigger for calendar alerts ==========
            // Pre-create AudioContext on first click so it works from console
            var _alertCtx = null;
            var _alertFlash = null;
            document.addEventListener("click", function () {
                if (!_alertCtx) {
                    try {
                        _alertCtx = new (
                            window.AudioContext || window.webkitAudioContext
                        )();
                    } catch (e) {}
                }
                if (_alertCtx && _alertCtx.state === "suspended") {
                    _alertCtx.resume().catch(function () {});
                }
                // Request notification permission on click too (browser allows this)
                if (
                    "Notification" in window &&
                    Notification.permission === "default"
                ) {
                    Notification.requestPermission();
                }
            });
            window.alertTrigger = function () {
                try {
                    // System notification
                    if (
                        "Notification" in window &&
                        Notification.permission === "granted"
                    ) {
                        new Notification("📅 TEST ALERT", {
                            body: "Calendar test — beep, notification, and screen flash.",
                            icon: "/images/favicon.png",
                        });
                    }

                    // Audio beep (needs AudioContext to exist and be running)
                    var ctx = _alertCtx;
                    if (ctx) {
                        if (ctx.state === "suspended")
                            ctx.resume().catch(function () {});
                        try {
                            var osc = ctx.createOscillator();
                            var gain = ctx.createGain();
                            osc.type = "square";
                            osc.frequency.value = 880;
                            gain.gain.value = 0.15;
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start();
                            var t = ctx.currentTime;
                            for (var p = 0; p < 10; p += 0.5) {
                                gain.gain.setValueAtTime(
                                    Math.floor(p / 0.5) % 2 === 0 ? 0.15 : 0,
                                    t + p,
                                );
                            }
                            gain.gain.setValueAtTime(0, t + 10);
                            osc.stop(t + 10);
                        } catch (e) {
                            console.warn("Beep error:", e);
                        }
                    } else {
                        console.log(
                            "ℹ️ Click on the page first to enable audio, then run alertTrigger() again.",
                        );
                    }
                } catch (e) {
                    console.warn("alertTrigger beep error:", e);
                }

                try {
                    // Screen flash — rapid red flashing until dismissed
                    var flash = document.getElementById("calAlertFlash");
                    if (!flash) {
                        flash = document.createElement("div");
                        flash.id = "calAlertFlash";
                        flash.style.cssText =
                            "position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:auto;z-index:9999;transition:none;opacity:1;background:rgba(220,0,0,0.25);";
                        document.body.appendChild(flash);
                        _alertFlash = flash;
                    }
                    var colors = ["rgba(220,0,0,0.25)", "rgba(220,0,0,0.50)"];
                    var ci = 0;
                    if (flash._interval) clearInterval(flash._interval);
                    flash.style.background = colors[0];
                    flash._interval = setInterval(function () {
                        ci = 1 - ci;
                        flash.style.background = colors[ci];
                    }, 400);
                    // Dismiss on click/touch
                    flash.onclick = window.clearAlert;
                    flash.ontouchstart = function (e) {
                        e.preventDefault();
                        window.clearAlert();
                    };
                } catch (e) {
                    console.warn("alertTrigger flash error:", e);
                }

                console.log(
                    "🔔 alertTrigger() fired — beep + red flash until dismissed",
                );
            };

            // Global clearAlert() to dismiss calendar alert
            window.clearAlert = function () {
                var flash = document.getElementById("calAlertFlash");
                if (flash) {
                    if (flash._interval) {
                        clearInterval(flash._interval);
                        flash._interval = null;
                    }
                    flash.onclick = null;
                    flash.ontouchstart = null;
                    flash.style.opacity = "0";
                    flash.style.background = "none";
                    flash.style.pointerEvents = "none";
                }
            };
        </script>

        <!-- ========== SUBSCRIPTION CHECK ========== -->
        <script>
            (async function () {
                const host = window.location.hostname;
                // Localhost and staging always get premium
                if (
                    host === "localhost" ||
                    host === "127.0.0.1" ||
                    host.startsWith("192.168.") ||
                    host.startsWith("staging.")
                ) {
                    window.PREMIUM_ACTIVE = true;
                    return;
                }
                const subId = localStorage.getItem("stripe_subscription_id");
                if (!subId) {
                    window.PREMIUM_ACTIVE = false;
                    return;
                }
                try {
                    const resp = await fetch(
                        `/api/subscription/status?subscription_id=${encodeURIComponent(subId)}`,
                    );
                    const data = await resp.json();
                    window.PREMIUM_ACTIVE = data.premium === true;
                    if (data.expiry) {
                        localStorage.setItem("premium_expiry", data.expiry);
                    }
                } catch (e) {
                    console.warn("Subscription check failed:", e);
                    window.PREMIUM_ACTIVE = false;
                }
            })();
        </script>

        <script src="js/core/module-buttons.js"></script>
        <script src="js/core/footer-controls.js"></script>

        <!-- ========== CLEANUP - shows/hides modules based on Master Module Record ========== -->
        <script>
            (function () {
                console.log("[Cleanup] Initializing...");

                function runCleanup() {
                    try {
                        if (!window.HANDI_MODULES) {
                            console.log(
                                "[Cleanup] HANDI_MODULES not available yet, retrying...",
                            );
                            setTimeout(runCleanup, 100);
                            return;
                        }
                        console.log(
                            "[Cleanup] HANDI_MODULES available:",
                            typeof window.HANDI_MODULES,
                        );

                        // Read the live Master Module Record
                        let mmr = window.getMMR();

                        // If subscription inactive, disable all premium modules in MMR
                        if (window.PREMIUM_ACTIVE === false) {
                            let changed = false;
                            const premiumIds = window
                                .HANDI_PREMIUM_MODULES()
                                .map((m) => m.id);
                            for (const id of premiumIds) {
                                if (mmr[id] !== 2) {
                                    mmr[id] = 2;
                                    changed = true;
                                }
                            }
                            if (changed) window.saveMMR(mmr);
                            console.log(
                                "[Cleanup] Premium disabled — subscription inactive",
                            );
                        }

                        console.log("[Cleanup] MMR:", JSON.stringify(mmr));

                        let allModules = window.HANDI_MODULE_IDS();
                        console.log("[Cleanup] Module IDs:", allModules);

                        let grid = document.getElementById("dashboard-grid");
                        console.log("[Cleanup] Grid:", !!grid);
                        if (!grid) return;

                        for (let id of allModules) {
                            let el = document.getElementById(id);
                            if (!el) continue;
                            // Only display modules with state 1 (on)
                            if (mmr[id] !== 1) {
                                el.remove();
                                console.log("[Cleanup] Removed:", id);
                            } else {
                                console.log("[Cleanup] Keeping:", id);
                            }
                        }
                    } catch (e) {
                        console.error("[Cleanup] Error:", e);
                    }
                }

                // Try multiple times to catch the modules after they've been initialized
                runCleanup();
                document.addEventListener("DOMContentLoaded", runCleanup);
                window.addEventListener("load", function () {
                    setTimeout(runCleanup, 500);
                });
            })();

            // First visit redirect
            (function () {
                if (localStorage.getItem("handiPopupShown") === "true") return;
                if (window.location.pathname.includes("/selector.html")) return;
                localStorage.setItem("handiPopupShown", "true");
                window.location.href = "/selector.html";
            })();
        </script>
