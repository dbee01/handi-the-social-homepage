<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HandiHomepage – Your Safe & Simple Dashboard</title>

    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="/css/vendor/fa-7.2.0/css/all.min.css">

    <!-- Main Styles -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/elderly.css">

    <style>
        /* FIX: Make header wrap vertically on mobile */
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: 100%;
        }

        /* FIX: Search wrapper takes full width on mobile */
        .search-wrapper {
            flex: 1;
            min-width: 200px;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 48px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px 4px 20px;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        #searchInput {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            font-size: 18px;
        }

        #searchEngine {
            border-radius: 8px;
            padding: 6px;
            border: 1px solid #ccc;
        }

        /* FIXED LOGO */
        #searchEngineLogo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: contain;
            display: block;
        }

        .search-button {
            border: none;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
        }

        .search-button:hover {
            opacity: 0.9;
        }

        /* FIX: Mobile responsive - stack everything vertically */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: stretch;
            }

            .site-branding {
                text-align: center;
            }

            .nav-links {
                width: 100%;
            }

            .search-wrapper {
                width: 100%;
                flex: none;
            }

            .header-weather {
                text-align: center;
                justify-content: center;
            }
        }

        /* FIX: Small phones - wrap search inner elements */
        @media (max-width: 550px) {
            .search-wrapper {
                flex-wrap: wrap;
                border-radius: 28px;
                padding: 12px;
                gap: 8px;
            }

            #searchInput {
                flex: 1 1 100%;
                order: 1;
            }

            #searchEngine {
                flex: 1;
                order: 2;
            }

            #searchEngineLogo {
                order: 3;
            }

            .search-button {
                order: 4;
                width: 100%;
                border-radius: 40px;
            }
        }
    </style>

    <script src="/js/vendor/his.js@latest"></script>
    <script src="/js/vendor/packery.pkgd.min.js"></script>
    <script src="/js/vendor/Sortable.min.js"></script>

    <script type="module">
        import { loadSettings } from './js/core/settings.js';
        import { startWeatherUpdates } from './js/core/weather.js';
        import initBus from './modules/bus/bus.module.js';
        import initGallery from './modules/gallery/gallery.module.js';
        import initMusic from './modules/music/music.module.js';
        import initNews from './modules/news/news.module.js';
        import initMastodon from './modules/mastodon/mastodon.module.js';
        import initRadio from './modules/radio/radio.module.js';
        import initEmergency from './modules/emergency/emergency.module.js';
        import initPhone from './modules/friendly-phone/friendly-phone.module.js';
        import initChat from './modules/chat/chat.module.js';
        import initCalendar from './modules/calendar/calendar.module.js';

        import { initLayout } from './js/core/layout.js';

        initLayout();

        const modules = {
            gallery: initGallery,
            bus: initBus,
            music: initMusic,
            news: initNews,
            mastodon: initMastodon,
            radio: initRadio,
            emergency: initEmergency,
            phone: initPhone,
            chat: initChat,
            calendar: initCalendar
        };

        const settings = loadSettings();
        const enabledModulesSettings = settings.enabledModules || {};

        let enabledModulesList = Object.keys(enabledModulesSettings)
            .filter(id => enabledModulesSettings[id] === true);

        if (enabledModulesList.length === 0) {
            enabledModulesList = [
                'gallery',
                'bus',
                'music',
                'news',
                'mastodon',
                'radio',
                'emergency',
                'phone',
                'chat',
                'calendar'
            ];
        }

        const allModuleIds = [
            'gallery',
            'bus',
            'music',
            'news',
            'mastodon',
            'radio',
            'emergency',
            'phone',
            'chat',
            'calendar'
        ];

        const grid = document.getElementById('dashboard-grid');

        if (grid) {
            enabledModulesList.forEach(moduleId => {
                const element = document.getElementById(moduleId);
                if (element) {
                    grid.appendChild(element);
                }
            });

            allModuleIds.forEach(moduleId => {
                if (!enabledModulesList.includes(moduleId)) {
                    const element = document.getElementById(moduleId);
                    if (element) {
                        grid.appendChild(element);
                    }
                }
            });
        }

        for (const [id, initFn] of Object.entries(modules)) {
            const element = document.getElementById(id);
            if (!element) continue;

            const isEnabled = enabledModulesList.includes(id);
            element.classList.toggle('hidden', !isEnabled);

            if (isEnabled) {
                const container = element.querySelector('.module-content');

                if (container) {
                    try {
                        initFn(container);
                    } catch (err) {
                        console.error(`Error initialising ${id}:`, err);
                    }
                }
            }
        }

        /* =========================================================
           SEARCH
        ========================================================= */

        function initializeSearch() {

            const searchInput = document.getElementById('searchInput');
            const searchEngine = document.getElementById('searchEngine');
            const searchEngineLogo = document.getElementById('searchEngineLogo');
            const searchButton = document.getElementById('searchButton');

            if (!searchInput || !searchEngine || !searchEngineLogo) {
                console.warn('Search elements missing');
                return;
            }

            /* REAL IMAGE URLS */
            const logoMap = {
                startpage: {
                    name: 'Startpage',
                    url: '/images/startpage.jpg'
                },
                qwant: {
                    name: 'Qwant',
                    url: '/images/qwant.jpg'
                },
                ecosia: {
                    name: 'Ecosia',
                    url: '/images/ecosia.jpg'
                },
                mojeek: {
                    name: 'Mojeek',
                    url: '/images/mojeek.jpg'
                }
            };

            function updateSearchLogo(value) {

                const engine = logoMap[value] || logoMap.startpage;

                searchEngineLogo.src = engine.url;
                searchEngineLogo.alt = engine.name;
                searchEngineLogo.title = engine.name;

                /* fallback if favicon fails */
                searchEngineLogo.onerror = () => {
                    searchEngineLogo.src =
                        'data:image/svg+xml;charset=UTF-8,' +
                        encodeURIComponent(`
                            <svg xmlns="http://www.w3.org/2000/svg"
                                 width="32"
                                 height="32">
                                <rect width="100%" height="100%" rx="8" fill="#5c6cff"/>
                                <text x="50%" y="55%"
                                      text-anchor="middle"
                                      fill="white"
                                      font-size="18"
                                      font-family="Arial">
                                      🔍
                                </text>
                            </svg>
                        `);
                };
            }

            updateSearchLogo(searchEngine.value);

            searchEngine.addEventListener('change', () => {
                updateSearchLogo(searchEngine.value);
            });

            function performSearch() {

                const query = searchInput.value.trim();

                if (!query) return;

                let searchUrl = '';

                switch (searchEngine.value) {

                    case 'startpage':
                        searchUrl =
                            `https://www.startpage.com/sp/search?query=${encodeURIComponent(query)}`;
                        break;

                    case 'qwant':
                        searchUrl =
                            `https://www.qwant.com/?q=${encodeURIComponent(query)}`;
                        break;

                    case 'ecosia':
                        searchUrl =
                            `https://www.ecosia.org/search?q=${encodeURIComponent(query)}`;
                        break;

                    case 'mojeek':
                        searchUrl =
                            `https://www.mojeek.com/search?q=${encodeURIComponent(query)}`;
                        break;

                    default:
                        searchUrl =
                            `https://www.startpage.com/sp/search?query=${encodeURIComponent(query)}`;
                }

                window.open(searchUrl, '_blank');
            }

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });

            if (searchButton) {
                searchButton.addEventListener('click', performSearch);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeSearch);
        } else {
            initializeSearch();
        }

        startWeatherUpdates();
    </script>
</head>

<body>

<script src="js/core/message.js"></script>


<header>

    <div class="site-branding">
        <div class="handi-logo">
            <a href="/" class="logo-link">
                <i class="fa-solid fa-hand-peace"></i>
                <span class="logo-text">HandiHomepage</span>
            </a>
        </div>
    </div>

    <div class="nav-links">

        <div class="search-wrapper">

            <input
                type="text"
                id="searchInput"
                placeholder="Search privately..."
            >

            <select id="searchEngine">
                <option value="startpage">Startpage</option>
                <option value="qwant">Qwant</option>
                <option value="ecosia">Ecosia</option>
                <option value="mojeek">Mojeek</option>
            </select>

            <img
                id="searchEngineLogo"
                src="https://www.startpage.com/sp/cdn/favicons/favicon.ico"
                alt="Search engine logo"
            >

            <button id="searchButton" class="search-button">
                <i class="fas fa-arrow-right"></i>
            </button>

        </div>

    </div>

    <div class="header-weather">
        <i class="fa-solid fa-cloud-sun"></i>
        <span id="weather">🌤️ --°C</span>
    </div>

</header>

<div class="dashboard-wrapper">

    <main id="dashboard-grid">

        <div id="gallery" class="dashboard-item module">
            <div class="module-content"></div>
        </div>

        <div id="bus" class="dashboard-item module">
            <div class="module-content"></div>
        </div>

        <div id="music" class="dashboard-item module">
            <div class="module-content"></div>
        </div>

        <div id="news" class="dashboard-item module">
            <div class="module-content"></div>
        </div>

        <div id="mastodon" class="dashboard-item module">
            <div class="module-content"></div>
        </div>

        <div id="radio" class="dashboard-item module">
            <div class="module-content"></div>
        </div>

        <div id="emergency" class="dashboard-item module">
            <div class="module-content"></div>
        </div>

        <div id="phone" class="dashboard-item module">
            <div class="module-content"></div>
        </div>

        <div id="chat" class="dashboard-item module">
            <div class="module-content"></div>
        </div>

        <div id="calendar" class="dashboard-item module">
            <div class="module-content"></div>
        </div>

    </main>

</div>

<footer>

    <div class="footer-bar">

        <button id="footerMuteBtn" class="footer-icon">
            <i class="fa-solid fa-volume-high"></i>
        </button>

        <button id="footerWakeLockBtn" class="footer-icon">
            <i class="fa-solid fa-bed"></i>
        </button>

        <button id="footerDocsBtn" class="footer-icon">
            <i class="fa-solid fa-book"></i>
        </button>

        <button id="footerCoffeeBtn" class="footer-icon">
            <i class="fa-solid fa-beer"></i>
        </button>

        <button id="footerEmailBtn" class="footer-icon">
            <i class="fa-solid fa-envelope"></i>
        </button>

        <button id="footerSettingsBtn" class="footer-icon">
            <i class="fa-solid fa-gear"></i>
        </button>

    </div>

</footer>

<div class="brand">
    <span class="subtitle">
        <a href="/terms">Terms of Service</a> |
        <a href="/privacy">Privacy Policy</a>
    </span>
</div>

<script src="js/core/module-buttons.js"></script>
<script src="js/core/footer-controls.js"></script>
<script src="js/core/first-popup.js"></script>

</body>
</html>
