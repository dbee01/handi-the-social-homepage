    <link rel="stylesheet" href="/css/vendor/fa-7.2.0/webfonts/fa-solid-900.woff2">
    <link rel="stylesheet" href="/css/vendor/fa-7.2.0/css/all.min.css">

    <script src="/js/vendor/Sortable.min.js"></script>
    <script type="module">
        import { loadSettings } from './js/core/settings.js';
        import { startWeatherUpdates } from './js/core/weather.js';
        import initBus from './modules/bus/bus.module.js';
        import initGallery from './modules/gallery/gallery.module.js';
        import initMusic from './modules/music/music.module.js';
        import initNews from './modules/news/news.module.js';
        import initMastodon from './modules/mastodon/mastodon.module.js';
        import initRadio from './modules/radio/radio.module.js';
        import initEmergency from './modules/emergency/emergency.module.js';
        import initPhone from './modules/friendly-phone/friendly-phone.module.js';
        import initChat from './modules/chat/chat.module.js';
        import initCalendar from './modules/calendar/calendar.module.js';

        import { initLayout } from './js/core/layout.js';

        initLayout();

        const modules = {
            gallery: initGallery,
            bus: initBus,
            music: initMusic,
            news: initNews,
            mastodon: initMastodon,
            radio: initRadio,
            emergency: initEmergency,
            phone: initPhone,
            chat: initChat,
            calendar: initCalendar
        };

        // Load settings and apply module visibility
        const settings = loadSettings();
        const enabledModulesSettings = settings.enabledModules || {};

        // Get list of enabled modules from settings
        let enabledModulesList = Object.keys(enabledModulesSettings).filter(id => enabledModulesSettings[id] === true);

        // If nothing is enabled, enable all
        if (enabledModulesList.length === 0) {
            enabledModulesList = ['gallery', 'bus', 'music', 'news', 'mastodon', 'radio', 'emergency', 'phone', 'chat', 'calendar'];
        }
        // All module IDs in order
        const allModuleIds = ['gallery', 'bus', 'music', 'news', 'mastodon', 'radio', 'emergency', 'phone', 'chat', 'calendar'];

        // Reorder the DOM based on enabled modules
        const grid = document.getElementById('dashboard-grid');
        if (grid) {
            // First, move enabled modules to top
            enabledModulesList.forEach(moduleId => {
                const element = document.getElementById(moduleId);
                if (element) {
                    grid.appendChild(element);
                }
            });
            // Then append disabled modules at bottom (they will be hidden anyway)
            allModuleIds.forEach(moduleId => {
                if (!enabledModulesList.includes(moduleId)) {
                    const element = document.getElementById(moduleId);
                    if (element) {
                        grid.appendChild(element);
                    }
                }
            });
        }

        // Show/hide and initialise modules
        for (const [id, initFn] of Object.entries(modules)) {
            const element = document.getElementById(id);
            if (!element) continue;
            
            // Check if module should be visible from settings
            const isEnabled = enabledModulesList.includes(id);
            element.classList.toggle('hidden', !isEnabled);
            
            if (isEnabled) {
                const container = element.querySelector('.module-content');
                if (container) {
                    try {
                        initFn(container);
                    } catch (err) {
                        console.error(`Error initialising ${id}:`, err);
                    }
                }
            }
        }
        
        // ----- Search functionality (European privacy‑friendly engines) -----
        function initializeSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchEngine = document.getElementById('searchEngine');
            const searchEngineLogo = document.getElementById('searchEngineLogo');

            if (!searchInput || !searchEngine || !searchEngineLogo) {
                console.warn("Search elements not found");
                return;
            }

            // Use emoji/unicode fallbacks instead of missing image files
            function updateSearchLogo(value) {
                const logoMap = {
                    startpage: { emoji: '🔒', name: 'Startpage', color: '#4A90E2' },
                    qwant: { emoji: '🐦', name: 'Qwant', color: '#5C9EFF' },
                    ecosia: { emoji: '🌳', name: 'Ecosia', color: '#4CAF50' },
                    mojeek: { emoji: '🔍', name: 'Mojeek', color: '#FF6B35' }
                };
                
                const engine = logoMap[value] || logoMap.startpage;
                
                // Instead of loading missing images, create a styled badge
                searchEngineLogo.style.display = 'inline-flex';
                searchEngineLogo.style.alignItems = 'center';
                searchEngineLogo.style.justifyContent = 'center';
                searchEngineLogo.style.width = '32px';
                searchEngineLogo.style.height = '32px';
                searchEngineLogo.style.borderRadius = '8px';
                searchEngineLogo.style.backgroundColor = engine.color;
                searchEngineLogo.style.color = 'white';
                searchEngineLogo.style.fontSize = '18px';
                searchEngineLogo.style.fontWeight = 'bold';
                searchEngineLogo.textContent = engine.emoji;
                searchEngineLogo.title = engine.name;
                
                // If you really want to use images, provide valid URLs:
                // const validImageUrls = {
                //     startpage: 'https://www.startpage.com/favicon.ico',
                //     qwant: 'https://www.qwant.com/favicon.ico',
                //     ecosia: 'https://ecosia.org/favicon.ico',
                //     mojeek: 'https://www.mojeek.com/favicon.ico'
                // };
                // const img = new Image();
                // img.src = validImageUrls[value];
                // img.onerror = () => { searchEngineLogo.textContent = engine.emoji; };
                // searchEngineLogo.src = validImageUrls[value];
            }

            updateSearchLogo(searchEngine.value);
            searchEngine.addEventListener('change', () => updateSearchLogo(searchEngine.value));

            function performSearch() {
                const query = searchInput.value.trim();
                if (!query) return;

                const engine = searchEngine.value;
                let searchUrl = '';

                switch (engine) {
                    case 'startpage':
                        searchUrl = `https://www.startpage.com/sp/search?query=${encodeURIComponent(query)}`;
                        break;
                    case 'qwant':
                        searchUrl = `https://www.qwant.com/?q=${encodeURIComponent(query)}`;
                        break;
                    case 'ecosia':
                        searchUrl = `https://www.ecosia.org/search?q=${encodeURIComponent(query)}`;
                        break;
                    case 'mojeek':
                        searchUrl = `https://www.mojeek.com/search?q=${encodeURIComponent(query)}`;
                        break;
                    default:
                        searchUrl = `https://www.startpage.com/sp/search?query=${encodeURIComponent(query)}`;
                }

                window.open(searchUrl, '_blank');
                searchInput.value = '';
            }

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });

            // Try multiple selector patterns for the search button
            const searchIcon = document.querySelector('.search-wrapper i.fa-arrow-right') || 
                            document.querySelector('.search-icon') ||
                            document.querySelector('#searchButton') ||
                            document.querySelector('button[aria-label="Search"]');
            
            if (searchIcon) {
                searchIcon.addEventListener('click', performSearch);
            } else {
                // Create a search button if none exists
                const wrapper = document.querySelector('.search-wrapper');
                if (wrapper && !searchIcon) {
                    const btn = document.createElement('button');
                    btn.innerHTML = '🔍';
                    btn.style.background = '#4A90E2';
                    btn.style.border = 'none';
                    btn.style.borderRadius = '8px';
                    btn.style.padding = '8px 12px';
                    btn.style.cursor = 'pointer';
                    btn.style.color = 'white';
                    btn.addEventListener('click', performSearch);
                    wrapper.appendChild(btn);
                }
            }
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeSearch);
        } else {
            initializeSearch();
        }

        // Start weather updates
        startWeatherUpdates();

        // Settings link
        document.getElementById('settingsLink')?.addEventListener('click', () => {
            window.location.href = 'settings.html';
        });
        
    </script>
    <!-- Privacy-friendly analytics by Plausible -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
             const isLoggedIn = document.body.classList.contains('logged-in');  
    
            if (!isLoggedIn) {
                // Load Plausible only for visitors
                const script = document.createElement('script');
                script.async = true;
                script.defer = true;
                script.src = 'https://plausible.io/js/pa-cvqvYb9dRTC-BwuguUIVj.js';
                document.head.appendChild(script);
                
                window.plausible = window.plausible || function() {
                    (window.plausible.q = window.plausible.q || []).push(arguments);
                };
            }
            
            });
        
    </script>
