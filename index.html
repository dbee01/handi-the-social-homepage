<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ple.ie</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- PACKERY -->
  <script src="https://unpkg.com/packery@2.1.2/dist/packery.pkgd.min.js"></script>
  
  <!-- SORTABLEJS -->
  <script src="https://unpkg.com/sortablejs@1.15.0/Sortable.min.js"></script>
  
  <!-- YOUR APP - Load with defer to ensure DOM is ready -->
  <script type="module" src="app.js" defer></script>

  <style>
    /* Simple Refresh Modal */
    .refresh-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 999999;
      justify-content: center;
      align-items: center;
    }
    
    .refresh-modal.active {
      display: flex;
    }
    
    .refresh-modal-content {
      background: #1a1a2e;
      border: 2px solid #ffaa00;
      border-radius: 12px;
      padding: 25px;
      max-width: 350px;
      width: 85%;
      text-align: center;
      position: relative;
      z-index: 999999;
    }
    
    .refresh-modal-icon {
      font-size: 3rem;
      color: #ffaa00;
      margin-bottom: 15px;
    }
    
    .refresh-modal-title {
      font-size: 1.3rem;
      color: #ffaa00;
      margin-bottom: 10px;
      font-weight: bold;
    }
    
    .refresh-modal-warning {
      background: rgba(255, 68, 68, 0.1);
      border-left: 3px solid #ff4444;
      padding: 10px;
      margin: 15px 0;
      color: #ff8888;
      font-size: 0.8rem;
      text-align: left;
    }
    
    .refresh-modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }
    
    .refresh-modal-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-family: monospace;
      font-size: 1rem;
    }
    
    .refresh-modal-btn.primary {
      background: #00ff41;
      color: #000;
    }
    
    .refresh-modal-btn.danger {
      background: #ff4444;
      color: #fff;
    }
    
    .refresh-modal-checkbox {
      margin: 10px 0;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #888;
      font-size: 0.75rem;
    }
    
    /* Pin button styles */
    .pin-btn {
      touch-action: manipulation;
      cursor: pointer;
      min-width: 40px;
      min-height: 40px;
      transition: all 0.2s;
    }
    
    .pin-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <i class="fa-solid fa-bolt"></i>
    <span>ple.ie</span>
  </div>
  <div class="search-wrapper">
    <select class="search-engine-select" id="searchEngine">
      <option value="google">Google</option>
      <option value="duckduckgo">DuckDuckGo</option>
      <option value="brave">Brave</option>
      <option value="proton">Proton</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search the network...">
    <i class="fa-solid fa-arrow-right" style="cursor: pointer;"></i>
  </div>
  <div class="header-weather">
    <i class="fa-solid fa-cloud-sun"></i>
    <span id="weather">Loading...</span>
  </div>
</header>

<div class="dashboard-wrapper" style="flex: 1;">
  <main id="dashboard-grid">

    <!-- Gallery Module -->
    <div class="dashboard-item" id="gallery" data-order="1">
      <button class="pin-btn" title="Pin to top"><i class="fa-solid fa-thumbtack"></i></button>
    </div>

    <!-- Emergency Module -->
    <div class="dashboard-item" id="emergency" data-order="2">
      <button class="pin-btn" title="Pin to top"><i class="fa-solid fa-thumbtack"></i></button>
    </div>
    
    <!-- Bus Module -->
    <div class="dashboard-item" id="bus" data-order="3">
      <button class="pin-btn" title="Pin to top"><i class="fa-solid fa-thumbtack"></i></button>
    </div>

    <!-- Friendly Phone Module -->
    <div class="dashboard-item" id="friendly-phone" data-order="11">
      <button class="pin-btn" title="Pin to top"><i class="fa-solid fa-thumbtack"></i></button>
    </div>
    
    <!-- Local Music Player Module -->
    <div class="dashboard-item" id="local-player" data-order="12">
      <button class="pin-btn" title="Pin to top">
        <i class="fa-solid fa-thumbtack"></i>
      </button>
      <div id="music-player" class="module-content"></div>
    </div>

  </main>
</div>

<footer>
  <div class="footer-content">
    <span><i class="fa-solid fa-location-dot"></i> Dublin</span>
    <span><i class="fa-solid fa-leaf"></i> Green Energy</span>
    <span><i class="fa-brands fa-github"></i> Open Source</span>
  </div>
</footer>

<!-- Simple Refresh Modal -->
<div id="refreshModal" class="refresh-modal">
  <div class="refresh-modal-content">
    <div class="refresh-modal-icon">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <div class="refresh-modal-title">⚠️ Refresh Page?</div>
    <div class="refresh-modal-warning">
      <i class="fa-solid fa-database"></i> Playing media will stop<br>
      <i class="fa-solid fa-image"></i> Slideshow position will reset
    </div>
    <div class="refresh-modal-checkbox">
      <input type="checkbox" id="dontShowAgain">
      <label>Don't show again this session</label>
    </div>
    <div class="refresh-modal-buttons">
      <button id="stayBtn" class="refresh-modal-btn primary">✓ Stay</button>
      <button id="refreshBtn" class="refresh-modal-btn danger">⟳ Refresh</button>
    </div>
  </div>
</div>

<script>
// ========== VIVALDI-FRIENDLY REFRESH WARNING ==========
(function() {
  console.log('🛡️ Initializing refresh protection...');
  
  let warningsEnabled = true;
  let refreshRequested = false;
  let modalVisible = false;
  
  // Check session storage
  if (sessionStorage.getItem('refreshWarningsOff') === 'true') {
    warningsEnabled = false;
    console.log('⚠️ Warnings disabled for this session');
  }
  
  const modal = document.getElementById('refreshModal');
  const stayBtn = document.getElementById('stayBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const dontShowCheckbox = document.getElementById('dontShowAgain');
  
  // Hide modal function
  function hideModal() {
    if (modal) {
      modal.classList.remove('active');
      modalVisible = false;
    }
  }
  
  // Show modal function
  function showModal(callback) {
    if (!warningsEnabled || refreshRequested) {
      if (callback) callback();
      return;
    }
    
    if (modal && !modalVisible) {
      modal.classList.add('active');
      modalVisible = true;
      window.pendingRefresh = callback;
      console.log('⚠️ Showing refresh warning modal');
    }
  }
  
  // Stay button - cancel refresh
  stayBtn.onclick = () => {
    console.log('✓ User cancelled refresh');
    hideModal();
    refreshRequested = false;
    window.pendingRefresh = null;
  };
  
  // Refresh button - proceed with refresh
  refreshBtn.onclick = () => {
    console.log('⟳ User confirmed refresh');
    
    if (dontShowCheckbox.checked) {
      warningsEnabled = false;
      sessionStorage.setItem('refreshWarningsOff', 'true');
    }
    
    hideModal();
    refreshRequested = true;
    
    // Execute the pending refresh
    if (window.pendingRefresh) {
      window.pendingRefresh();
    } else {
      // Force reload without warnings
      window.location.href = window.location.href;
    }
  };
  
  // Click outside to close
  modal.onclick = (e) => {
    if (e.target === modal) {
      hideModal();
    }
  };
  
  // ESC key to close
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalVisible) {
      hideModal();
    }
  });
  
  // ========== INTERCEPT F5 AND CTRL+R ==========
  document.addEventListener('keydown', (e) => {
    const isF5 = e.key === 'F5';
    const isCtrlR = (e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R');
    
    if ((isF5 || isCtrlR) && warningsEnabled && !refreshRequested) {
      e.preventDefault();
      e.stopPropagation();
      console.log('🔑 Keyboard refresh detected, showing modal');
      showModal(() => {
        window.location.reload();
      });
      return false;
    }
  });
  
  // ========== INTERCEPT BEFOREUNLOAD (Browser refresh button) ==========
  let beforeUnloadTime = null;
  
  window.addEventListener('beforeunload', (e) => {
    if (warningsEnabled && !refreshRequested && !modalVisible) {
      beforeUnloadTime = Date.now();
      console.log('🔄 Browser refresh detected');
      
      // Show modal with a slight delay
      setTimeout(() => {
        if (!refreshRequested) {
          showModal(() => {
            window.location.reload();
          });
        }
      }, 10);
      
      // Required for Chrome/Vivaldi
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  });
  
  // ========== INTERCEPT LOCATION.RELOAD ==========
  const originalReload = window.location.reload;
  window.location.reload = function(forceReload) {
    console.log('🔄 Programmatic reload detected');
    if (warningsEnabled && !refreshRequested && !modalVisible) {
      showModal(() => {
        originalReload.call(window.location, forceReload);
      });
    } else {
      originalReload.call(window.location, forceReload);
    }
  };
  
  // ========== HANDLE PAGE LOAD RESET ==========
  window.addEventListener('load', () => {
    refreshRequested = false;
    modalVisible = false;
    console.log('📄 Page loaded, refresh protection ready');
  });
  
  // ========== CONSOLE HELPERS ==========
  window.disableRefreshWarnings = function() {
    warningsEnabled = false;
    sessionStorage.setItem('refreshWarningsOff', 'true');
    console.log('⚠️ Refresh warnings DISABLED');
    alert('Refresh warnings disabled for this session');
  };
  
  window.enableRefreshWarnings = function() {
    warningsEnabled = true;
    sessionStorage.removeItem('refreshWarningsOff');
    console.log('✅ Refresh warnings ENABLED');
    alert('Refresh warnings enabled');
  };
  
  window.testRefreshWarning = function() {
    console.log('🧪 Testing refresh warning...');
    showModal(() => {
      window.location.reload();
    });
  };
  
  console.log('✅ Refresh protection active for Vivaldi');
  console.log('💡 Commands: testRefreshWarning(), enableRefreshWarnings(), disableRefreshWarnings()');
})();

// ========== PIN FEATURE ==========
(function() {
  console.log('📌 Initializing pin feature...');
  
  function savePins() {
    const pinned = Array.from(document.querySelectorAll('.dashboard-item.pinned')).map(i => i.id);
    localStorage.setItem('pinnedItems', JSON.stringify(pinned));
  }
  
  function loadPins() {
    const saved = localStorage.getItem('pinnedItems');
    if (saved) {
      JSON.parse(saved).forEach(id => {
        const item = document.getElementById(id);
        if (item) {
          item.classList.add('pinned');
          const btn = item.querySelector('.pin-btn');
          if (btn) {
            btn.style.color = '#00ff41';
            btn.style.transform = 'rotate(45deg)';
          }
        }
      });
      console.log('📌 Loaded pinned state');
    }
  }
  
  function movePinsToTop() {
    const grid = document.getElementById('dashboard-grid');
    if (!grid) return;
    
    const items = Array.from(grid.children);
    const pinned = items.filter(i => i.classList.contains('pinned'));
    const unpinned = items.filter(i => !i.classList.contains('pinned'));
    
    pinned.forEach(i => grid.appendChild(i));
    unpinned.forEach(i => grid.appendChild(i));
    
    // Refresh Packery if available
    if (window.pckry) {
      window.pckry.reloadItems();
      window.pckry.layout();
    }
  }
  
  function initPins() {
    const pinButtons = document.querySelectorAll('.pin-btn');
    
    pinButtons.forEach(btn => {
      // Clone to remove old listeners
      const newBtn = btn.cloneNode(true);
      btn.parentNode.replaceChild(newBtn, btn);
      
      newBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const item = newBtn.closest('.dashboard-item');
        
        if (item.classList.contains('pinned')) {
          item.classList.remove('pinned');
          newBtn.style.color = '';
          newBtn.style.transform = '';
          console.log(`📌 Unpinned: ${item.id}`);
        } else {
          item.classList.add('pinned');
          newBtn.style.color = '#00ff41';
          newBtn.style.transform = 'rotate(45deg)';
          console.log(`📌 Pinned: ${item.id}`);
        }
        
        movePinsToTop();
        savePins();
      });
      
      // Touch feedback
      newBtn.addEventListener('touchstart', () => {
        newBtn.style.transform = 'scale(0.95)';
      });
      newBtn.addEventListener('touchend', () => {
        if (!newBtn.closest('.dashboard-item')?.classList.contains('pinned')) {
          newBtn.style.transform = '';
        }
      });
    });
    
    console.log(`✅ Initialized ${pinButtons.length} pin buttons`);
  }
  
  // Initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      loadPins();
      initPins();
      setTimeout(movePinsToTop, 100);
    });
  } else {
    loadPins();
    initPins();
    setTimeout(movePinsToTop, 100);
  }
  
  console.log('✅ Pin feature active - click 📌 to pin modules');
})();
</script>

</body>
</html>
