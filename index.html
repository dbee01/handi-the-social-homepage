<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ple.ie</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="manifest" href="manifest.json">

  <!-- PACKERY -->

  <script type="module" src="app.js" defer></script>

  <style>
    /* Refresh Warning Modal Styles */
    .refresh-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(20px);
      z-index: 20000;
      justify-content: center;
      align-items: center;
      font-family: monospace;
      animation: fadeIn 0.2s ease-out;
    }
    
    .refresh-modal.active {
      display: flex;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .refresh-modal-content {
      background: var(--panel-bg, #1a1a2e);
      border: 2px solid var(--term-amber, #ffaa00);
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 50px rgba(255, 170, 0, 0.3);
      animation: slideUp 0.3s ease-out;
    }
    
    @keyframes slideUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    .refresh-modal-icon {
      font-size: 4rem;
      color: var(--term-amber, #ffaa00);
      margin-bottom: 20px;
    }
    
    .refresh-modal-title {
      font-size: 1.8rem;
      color: var(--term-amber, #ffaa00);
      margin-bottom: 15px;
      font-weight: bold;
    }
    
    .refresh-modal-message {
      color: var(--term-white, #fff);
      margin-bottom: 15px;
      line-height: 1.5;
      font-size: 1.1rem;
    }
    
    .refresh-modal-warning {
      background: rgba(255, 68, 68, 0.15);
      border-left: 3px solid var(--term-red, #ff4444);
      padding: 15px;
      margin: 20px 0;
      color: var(--term-red, #ff4444);
      font-size: 0.9rem;
      text-align: left;
      border-radius: 8px;
    }
    
    .refresh-modal-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }
    
    .refresh-modal-btn {
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      font-family: monospace;
      font-size: 1rem;
    }
    
    .refresh-modal-btn.primary {
      background: var(--term-green, #00ff41);
      color: #000;
    }
    
    .refresh-modal-btn.primary:hover {
      background: var(--term-green-light, #00ff66);
      transform: scale(1.05);
    }
    
    .refresh-modal-btn.danger {
      background: rgba(255, 68, 68, 0.9);
      color: #fff;
      border: 1px solid var(--term-red, #ff4444);
    }
    
    .refresh-modal-btn.danger:hover {
      background: var(--term-red, #ff4444);
      transform: scale(1.05);
    }
    
    .refresh-modal-checkbox {
      margin: 15px 0;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--term-dim, #888);
      font-size: 0.85rem;
    }
    
    .refresh-modal-checkbox input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--term-green, #00ff41);
    }
    
    /* Toast notification */
    .refresh-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: var(--term-green, #00ff41);
      padding: 12px 24px;
      border-radius: 50px;
      z-index: 20001;
      font-family: monospace;
      font-size: 0.9rem;
      white-space: nowrap;
      border: 1px solid var(--term-green, #00ff41);
      animation: toastSlideUp 0.3s ease-out;
      pointer-events: none;
    }
    
    @keyframes toastSlideUp {
      from {
        transform: translateX(-50%) translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }
    
    /* Pin button mobile optimization */
    .pin-btn {
      touch-action: manipulation;
      cursor: pointer;
      min-width: 44px;
      min-height: 44px;
      transition: all 0.2s;
    }
    
    .pin-btn:active {
      transform: scale(0.95);
    }
    
    /* Mobile-friendly tap targets */
    @media (max-width: 768px) {
      button, .pin-btn, .gallery-controls button, .refresh-modal-btn {
        min-height: 48px;
        min-width: 48px;
      }
    }
  </style>
</head>

<!-- Refresh Warning Modal HTML -->
<div id="refreshWarningModal" class="refresh-modal">
  <div class="refresh-modal-content">
    <div class="refresh-modal-icon">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <div class="refresh-modal-title">
      ⚠️ Refresh Detected ⚠️
    </div>
    <div class="refresh-modal-message">
      Are you sure you want to refresh the page?
    </div>
    <div class="refresh-modal-warning">
      <i class="fa-solid fa-database"></i> <strong>You will lose:</strong><br><br>
      • All playing audio/video<br>
      • Current slideshow position<br>
      • Unsaved changes<br>
      • Active downloads
    </div>
    <div class="refresh-modal-checkbox">
      <input type="checkbox" id="dontShowRefreshWarning">
      <label for="dontShowRefreshWarning">Don't show this warning again this session</label>
    </div>
    <div class="refresh-modal-buttons">
      <button id="refreshStayBtn" class="refresh-modal-btn primary">
        <i class="fa-solid fa-check"></i> Stay on Page
      </button>
      <button id="refreshLeaveBtn" class="refresh-modal-btn danger">
        <i class="fa-solid fa-rotate-right"></i> Refresh Anyway
      </button>
    </div>
  </div>
</div>

<script>
  // ========== WORKING PAGE REFRESH WARNING SYSTEM ==========
  (function() {
    console.log('🛡️ Initializing refresh protection system...');
    
    let warningEnabled = true;
    let pendingRefresh = null;
    let userConfirmedRefresh = false;
    
    const modal = document.getElementById('refreshWarningModal');
    const stayBtn = document.getElementById('refreshStayBtn');
    const leaveBtn = document.getElementById('refreshLeaveBtn');
    const dontShowCheckbox = document.getElementById('dontShowRefreshWarning');
    
    // Check session storage for preference
    if (sessionStorage.getItem('refreshWarningDisabled') === 'true') {
      warningEnabled = false;
      console.log('⚠️ Refresh warnings disabled for this session');
    }
    
    // Show toast notification
    function showToast(message, isWarning = false) {
      const toast = document.createElement('div');
      toast.className = 'refresh-toast';
      toast.innerHTML = `<i class="fa-solid ${isWarning ? 'fa-exclamation-triangle' : 'fa-shield-alt'}"></i> ${message}`;
      toast.style.background = isWarning ? 'rgba(255, 68, 68, 0.9)' : 'rgba(0, 0, 0, 0.9)';
      toast.style.color = isWarning ? '#fff' : 'var(--term-green)';
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }
    
    // Show warning modal
    function showRefreshWarning(refreshCallback) {
      if (!warningEnabled) {
        if (refreshCallback) refreshCallback();
        return;
      }
      
      if (modal && !modal.classList.contains('active')) {
        pendingRefresh = refreshCallback;
        modal.classList.add('active');
        showToast('⛔ Refresh blocked - confirm to continue', true);
        console.log('⚠️ Refresh warning shown to user');
      }
    }
    
    // Hide modal
    function hideModal() {
      if (modal) {
        modal.classList.remove('active');
      }
      pendingRefresh = null;
    }
    
    // Handle stay
    function handleStay() {
      hideModal();
      showToast('✅ Refresh cancelled - staying on page');
      console.log('User chose to stay on page');
    }
    
    // Handle leave/refresh
    function handleLeave() {
      if (dontShowCheckbox && dontShowCheckbox.checked) {
        warningEnabled = false;
        sessionStorage.setItem('refreshWarningDisabled', 'true');
        showToast('🔕 Refresh warnings disabled for this session');
      }
      
      hideModal();
      userConfirmedRefresh = true;
      
      showToast('🔄 Refreshing page...');
      console.log('User confirmed refresh - reloading page');
      
      // Execute the refresh
      if (pendingRefresh) {
        pendingRefresh();
      } else {
        setTimeout(() => {
          window.location.reload();
        }, 100);
      }
    }
    
    // Add event listeners
    if (stayBtn) stayBtn.addEventListener('click', handleStay);
    if (leaveBtn) leaveBtn.addEventListener('click', handleLeave);
    
    // Close modal on ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal?.classList.contains('active')) {
        handleStay();
      }
    });
    
    // Close modal on background click
    if (modal) {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) handleStay();
      });
    }
    
    // ========== INTERCEPT ALL REFRESH METHODS ==========
    
    // 1. Keyboard shortcuts (F5, Cmd+R, Ctrl+R)
    document.addEventListener('keydown', (event) => {
      const isRefresh = (event.key === 'F5') ||
                       (event.key === 'r' && (event.ctrlKey || event.metaKey)) ||
                       (event.key === 'R' && (event.ctrlKey || event.metaKey));
      
      if (isRefresh && warningEnabled && !userConfirmedRefresh) {
        event.preventDefault();
        event.stopPropagation();
        console.log('🔑 Keyboard refresh detected');
        showRefreshWarning(() => {
          window.location.reload();
        });
        return false;
      }
    });
    
    // 2. Browser refresh button (via beforeunload)
    let beforeUnloadTime = null;
    
    window.addEventListener('beforeunload', (event) => {
      if (warningEnabled && !userConfirmedRefresh) {
        beforeUnloadTime = Date.now();
        console.log('🔄 Browser refresh/close detected');
        
        // Show our custom modal (asynchronously)
        setTimeout(() => {
          if (!userConfirmedRefresh) {
            showRefreshWarning(() => {
              userConfirmedRefresh = true;
              window.location.reload();
            });
          }
        }, 10);
        
        // Set the native message (required for beforeunload to show)
        event.preventDefault();
        event.returnValue = 'You have unsaved changes. Are you sure you want to leave?';
        return event.returnValue;
      }
    });
    
    // 3. Override location.reload()
    const originalReload = window.location.reload;
    window.location.reload = function(forceReload) {
      console.log('🔄 Programmatic reload detected');
      if (warningEnabled && !userConfirmedRefresh) {
        showRefreshWarning(() => {
          userConfirmedRefresh = true;
          originalReload.call(window.location, forceReload);
        });
      } else {
        originalReload.call(window.location, forceReload);
      }
    };
    
    // 4. Detect pull-to-refresh on mobile (touch-based)
    let touchStartY = 0;
    let pullToRefreshThreshold = 80;
    let isRefreshing = false;
    
    document.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
      isRefreshing = false;
    }, { passive: true });
    
    document.addEventListener('touchmove', (e) => {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      const touchCurrentY = e.touches[0].clientY;
      const pullDistance = touchCurrentY - touchStartY;
      
      // Detect pull-to-refresh (scrolled to top and pulling down)
      if (scrollTop === 0 && pullDistance > pullToRefreshThreshold && !isRefreshing && warningEnabled && !userConfirmedRefresh) {
        isRefreshing = true;
        e.preventDefault();
        console.log('📱 Pull-to-refresh detected');
        showRefreshWarning(() => {
          userConfirmedRefresh = true;
          window.location.reload();
        });
      }
    }, { passive: false });
    
    // 5. Detect Ctrl+Shift+R (hard refresh)
    document.addEventListener('keydown', (event) => {
      if (event.key === 'r' && event.ctrlKey && event.shiftKey && warningEnabled && !userConfirmedRefresh) {
        event.preventDefault();
        console.log('🔑 Hard refresh (Ctrl+Shift+R) detected');
        showRefreshWarning(() => {
          userConfirmedRefresh = true;
          window.location.reload(true);
        });
      }
    });
    
    // 6. Detect meta refresh tags
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.type === 'attributes' && mutation.attributeName === 'content') {
          const metaRefresh = document.querySelector('meta[http-equiv="refresh"]');
          if (metaRefresh && warningEnabled && !userConfirmedRefresh) {
            console.log('🔄 Meta refresh tag detected');
            showRefreshWarning(() => {
              userConfirmedRefresh = true;
              window.location.reload();
            });
          }
        }
      });
    });
    
    observer.observe(document.head, {
      attributes: true,
      attributeFilter: ['content'],
      subtree: true
    });
    
    // Reset userConfirmedRefresh after page loads (new page load)
    window.addEventListener('load', () => {
      userConfirmedRefresh = false;
      beforeUnloadTime = null;
      console.log('📄 Page fully loaded - refresh protection active');
    });
    
    // Console helpers for testing
    window.testRefreshWarning = function() {
      console.log('🧪 Testing refresh warning...');
      showRefreshWarning(() => {
        console.log('Test refresh confirmed');
        window.location.reload();
      });
    };
    
    window.enableRefreshWarnings = function() {
      warningEnabled = true;
      sessionStorage.removeItem('refreshWarningDisabled');
      showToast('🛡️ Refresh warnings ENABLED');
      console.log('Refresh warnings enabled');
    };
    
    window.disableRefreshWarnings = function() {
      warningEnabled = false;
      sessionStorage.setItem('refreshWarningDisabled', 'true');
      showToast('⚠️ Refresh warnings DISABLED');
      console.log('Refresh warnings disabled');
    };
    
    window.getRefreshStatus = function() {
      console.log(`Refresh warnings: ${warningEnabled ? 'ENABLED' : 'DISABLED'}`);
      console.log(`User confirmed refresh: ${userConfirmedRefresh}`);
      return { enabled: warningEnabled, confirmed: userConfirmedRefresh };
    };
    
    console.log('✅ Refresh protection active!');
    console.log('💡 Commands: testRefreshWarning(), enableRefreshWarnings(), disableRefreshWarnings(), getRefreshStatus()');
    console.log('💡 Try: F5, Cmd/Ctrl+R, pull-to-refresh, or browser refresh button');
  })();
</script>

<script>
  // ========== PIN FEATURE - ENABLED BY DEFAULT ON MOBILE ==========
  (function() {
    console.log('📌 Initializing pin feature...');
    
    // Function to move pinned items to top
    function movePinnedToTop(grid) {
      const items = Array.from(document.querySelectorAll('.dashboard-item'));
      const pinnedItems = items.filter(item => item.classList.contains('pinned'));
      const unpinnedItems = items.filter(item => !item.classList.contains('pinned'));
      
      // Reorder DOM: pinned items first
      pinnedItems.forEach(item => grid.appendChild(item));
      unpinnedItems.forEach(item => grid.appendChild(item));
      
      // Store pin order in localStorage
      const pinnedOrder = pinnedItems.map(item => item.id);
      localStorage.setItem('pinnedItems', JSON.stringify(pinnedOrder));
      
      console.log(`📌 Moved ${pinnedItems.length} pinned items to top`);
    }
    
    // Load pinned items from localStorage
    function loadPinnedState() {
      const savedPins = localStorage.getItem('pinnedItems');
      if (savedPins) {
        const pinnedIds = JSON.parse(savedPins);
        pinnedIds.forEach(id => {
          const item = document.getElementById(id);
          if (item) {
            item.classList.add('pinned');
            const pinBtn = item.querySelector('.pin-btn');
            if (pinBtn) {
              pinBtn.style.color = 'var(--term-green)';
              pinBtn.style.transform = 'rotate(45deg)';
            }
          }
        });
        console.log('📌 Loaded pinned state:', pinnedIds);
      }
    }
    
    // Initialize pin buttons
    function initPinButtons() {
      const pinButtons = document.querySelectorAll('.pin-btn');
      
      pinButtons.forEach(btn => {
        // Remove existing listeners to avoid duplicates
        const newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);
        
        newBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const dashboardItem = newBtn.closest('.dashboard-item');
          if (!dashboardItem) return;
          
          // Toggle pinned class
          if (dashboardItem.classList.contains('pinned')) {
            dashboardItem.classList.remove('pinned');
            newBtn.style.color = '';
            newBtn.style.transform = '';
            console.log(`📌 Unpinned: ${dashboardItem.id}`);
            showToast(`📌 Unpinned ${dashboardItem.id}`, false);
          } else {
            dashboardItem.classList.add('pinned');
            newBtn.style.color = 'var(--term-green)';
            newBtn.style.transform = 'rotate(45deg)';
            console.log(`📌 Pinned: ${dashboardItem.id}`);
            showToast(`📌 Pinned ${dashboardItem.id} to top`, false);
          }
          
          // Move pinned items to top
          const grid = document.getElementById('dashboard-grid');
          if (grid && window.Packery) {
            movePinnedToTop(grid);
            // Refresh Packery layout
            if (window.pckry) {
              window.pckry.reloadItems();
              window.pckry.layout();
            }
          } else {
            movePinnedToTop(grid);
          }
          
          // Store state
          const pinnedIds = Array.from(document.querySelectorAll('.dashboard-item.pinned'))
            .map(item => item.id);
          localStorage.setItem('pinnedItems', JSON.stringify(pinnedIds));
        });
        
        // Add touch feedback for mobile
        newBtn.addEventListener('touchstart', () => {
          newBtn.style.transform = 'scale(0.95)';
        });
        newBtn.addEventListener('touchend', () => {
          newBtn.style.transform = '';
        });
      });
      
      console.log(`✅ Initialized ${pinButtons.length} pin buttons`);
    }
    
    // Show toast helper
    function showToast(message, isError = false) {
      const toast = document.createElement('div');
      toast.className = 'refresh-toast';
      toast.innerHTML = `<i class="fa-solid fa-thumbtack"></i> ${message}`;
      toast.style.background = 'rgba(0, 0, 0, 0.9)';
      toast.style.color = 'var(--term-green)';
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }
    
    // Wait for DOM to be ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        loadPinnedState();
        initPinButtons();
        
        // Move pinned items after layout is ready
        setTimeout(() => {
          const grid = document.getElementById('dashboard-grid');
          if (grid) {
            movePinnedToTop(grid);
          }
        }, 500);
      });
    } else {
      loadPinnedState();
      initPinButtons();
      setTimeout(() => {
        const grid = document.getElementById('dashboard-grid');
        if (grid) {
          movePinnedToTop(grid);
        }
      }, 500);
    }
    
    // Export for debugging
    window.pinFeature = {
      movePinnedToTop,
      loadPinnedState,
      initPinButtons,
      showToast
    };
    
    console.log('✅ Pin feature enabled - click any 📌 to pin modules to top!');
  })();
</script>
