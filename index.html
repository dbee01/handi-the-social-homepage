        <script>
            // Load theme CSS based on saved preference
            (function () {
                try {
                    var theme = localStorage.getItem("handiTheme") || "senior";
                    var customCss = localStorage.getItem("handiCustomTheme");

                    // If a custom dashboard pack theme exists, use site-pack.css which respects CSS variables
                    var cssUrl;
                    if (customCss) {
                        cssUrl = "/css/site-pack.css?v=2";
                    } else {
                        var themes = {
                            senior: "/css/elderly.css",
                            techie: "/css/techie.css",
                            woman: "/css/woman.css",
                            student: "/css/student.css",
                        };
                        cssUrl = themes[theme] || themes.senior;
                    }

                    var link = document.createElement("link");
                    link.id = "theme-link";
                    link.rel = "stylesheet";
                    link.href = cssUrl;
                    document.head.appendChild(link);

                    // Apply background image data URL from pack upload
                    var bgUrl = localStorage.getItem("handiBgDataUrl");

                    // Inject custom :root variable overrides
                    if (customCss) {
                        // If a data-URL background is available, strip --bg-image from the
                        // custom CSS to avoid 404s from relative URLs (they resolve against
                        // site-pack.css's location, e.g. img/foo.png → /css/img/foo.png).
                        var cleanedCss = bgUrl
                            ? customCss.replace(/--bg-image\s*:\s*[^;]+;?\s*/g, "")
                            : customCss;
                        var style = document.createElement("style");
                        style.id = "custom-theme";
                        style.textContent = cleanedCss;
                        document.head.appendChild(style);
                    }

                    if (bgUrl) {
                        var bgStyle = document.createElement("style");
                        bgStyle.textContent =
                            ":root { --bg-image: url(" + bgUrl + "); }";
                        document.head.appendChild(bgStyle);
                    }
                } catch (e) {
                    /* localStorage unavailable */
                }
            })();
        </script>

        <script>
            // Fill the social-graph (Open Graph) tags from the handi-pack link:
            //   handi-pack → og:title, description → og:description,
            //   logo → og:image. Falls back to the static Handi values.
            try {
                function __ogSet(attr, name, value) {
                    var el = document.querySelector('meta[' + attr + '="' + name + '"]');
                    if (el) el.setAttribute("content", value);
                }
                var packName = localStorage.getItem("handiPackName");
                var packLogo = localStorage.getItem("handiPackLogo");
                var packDesc = localStorage.getItem("handiPackDescription");
                if (packName)
                    __ogSet("property", "og:title", packName + " – Handi Homepage");
                if (packDesc)
                    __ogSet("property", "og:description", packDesc);
                if (packLogo && /^https?:\/\//i.test(packLogo)) {
                    __ogSet("property", "og:image", packLogo);
                    __ogSet("name", "twitter:image", packLogo);
                }
                __ogSet("property", "og:url", window.location.href);
            } catch (e) {}
        </script>

        <script>
            // Wire the top share bar links (same share targets as the bottom bar)
            (function () {
                var url = encodeURIComponent(window.location.href);
                var title = encodeURIComponent(document.title || "Handi Homepage");
                var text = encodeURIComponent("Check out my Handi Homepage!");
                var hrefs = {
                    facebook: "https://www.facebook.com/sharer/sharer.php?u=" + url,
                    x: "https://twitter.com/intent/tweet?url=" + url + "&text=" + text,
                    whatsapp: "https://wa.me/?text=" + text + "%20" + url,
                    linkedin: "https://www.linkedin.com/sharing/share-offsite/?url=" + url,
                    telegram: "https://t.me/share/url?url=" + url + "&text=" + text,
                    mastodon: "https://mastodon.social/share?text=" + text + "%20" + url,
                    email: "mailto:?subject=" + title + "&body=" + text + "%0A" + url,
                };
                document.querySelectorAll(".top-sharebar__btn[data-network]").forEach(function (el) {
                    var n = el.getAttribute("data-network");
                    if (hrefs[n]) el.setAttribute("href", hrefs[n]);
                });
                var copyBtn = document.querySelector('.top-sharebar__btn[data-network="copy"]');
                if (copyBtn) {
                    copyBtn.addEventListener("click", function (e) {
                        e.preventDefault();
                        var done = function () {
                            copyBtn.setAttribute("title", "Link copied!");
                            setTimeout(function () {
                                copyBtn.setAttribute("title", "Copy link");
                            }, 2000);
                        };
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(window.location.href).then(done, done);
                        } else {
                            var ta = document.createElement("textarea");
                            ta.value = window.location.href;
                            document.body.appendChild(ta);
                            ta.select();
                            try { document.execCommand("copy"); } catch (err) {}
                            document.body.removeChild(ta);
                            done();
                        }
                    });
                }
            })();
        </script>

        <!-- Service worker update handler -->
        <script>
            // Register the service worker. Without this, a previously
            // installed worker keeps controlling the page after a deploy and
            // can keep serving stale cached HTML (blank / old versions).
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("/service-worker.js").catch(
                    (err) => console.error("SW register failed:", err),
                );
            }

            navigator.serviceWorker?.addEventListener("message", (e) => {
                if (e.data?.type === "update") {
                    // Auto-reload so open tabs never keep running old code.
                    window.location.reload();
                }
            });

            // Tell the service worker which icon/badge the current page brand
            // uses (server picks it per pack: Gaeilge gets its cyan icons,
            // everything else the default favicon). Notifications then match.
            function swPostBrand(reg) {
                var link =
                    document.querySelector('link[rel="apple-touch-icon"]') ||
                    document.querySelector('link[rel="icon"][type="image/png"]') ||
                    document.querySelector('link[rel="icon"]');
                var icon = link
                    ? link.getAttribute("href")
                    : "/images/favicon.png";
                var active = reg && reg.active;
                if (!active) return;
                try {
                    active.postMessage({
                        type: "set-brand",
                        icon: icon,
                        badge: icon,
                    });
                } catch (err) {}
            }

            // Trigger update check + brand sync when the page loads
            navigator.serviceWorker?.ready.then((reg) => {
                swPostBrand(reg);
                reg.active?.postMessage("check-update");
            });
            // Re-sync the brand when a new worker takes control
            navigator.serviceWorker?.addEventListener(
                "controllerchange",
                function () {
                    navigator.serviceWorker.ready.then(swPostBrand);
                },
            );
        </script>

        <!-- PWA manifest per active pack. The server already picks the
             manifest from the URL params, but the pack import then redirects
             to a clean URL — so re-apply it here from the stored pack id.
             Non-Gaeilge packs get NO manifest (no installable app). -->
        <script>
            (function () {
                var GAEILGE_PACK_ID =
                    "399d4da865fb4bdb40133def9fc830af460764597854c9c5ede61b4d3a371a30";

                function setMeta(name, value) {
                    var el = document.querySelector('meta[name="' + name + '"]');
                    if (el) el.setAttribute("content", value);
                }
                function setLinkHref(rel, href) {
                    var el = document.querySelector('link[rel="' + rel + '"]');
                    if (el) el.setAttribute("href", href);
                }

                function isGaeilge() {
                    try {
                        var pid = localStorage.getItem("handiPackId");
                        var name = localStorage.getItem("handiPackName") || "";
                        var logo = localStorage.getItem("handiPackLogo") || "";
                        return (
                            pid === GAEILGE_PACK_ID ||
                            /^handi-homepage as gaeilge/i.test(name) ||
                            /gaeilge[-.]/i.test(logo)
                        );
                    } catch (e) {
                        return false;
                    }
                }
                function hasPack() {
                    try {
                        return !!(
                            localStorage.getItem("handiPackId") ||
                            localStorage.getItem("handiPackName") ||
                            localStorage.getItem("handiPackLogo")
                        );
                    } catch (e) {
                        return false;
                    }
                }

                function adjust() {
                    var link = document.querySelector('link[rel="manifest"]');
                    if (!link) return;

                    if (isGaeilge()) {
                        link.setAttribute(
                            "href",
                            "/manifests/gaeilge.manifest.json",
                        );
                        setMeta("theme-color", "#00c1f2");
                        setMeta("apple-mobile-web-app-title", "Gaeilge");
                        setLinkHref(
                            "apple-touch-icon",
                            "/images/icons/gaeilge/gaeilge-180x180.png",
                        );
                        setLinkHref(
                            "icon",
                            "/images/icons/gaeilge/gaeilge-32x32.png",
                        );
                    } else if (hasPack()) {
                        // Another handi-pack: no installable app.
                        link.parentNode.removeChild(link);
                    }
                }

                adjust();
                window.addEventListener("load", function () {
                    adjust();
                });
                // The pack import writes storage asynchronously, so re-check
                // briefly after load too.
                setTimeout(adjust, 500);
                setTimeout(adjust, 2000);
                // Also react when the pack is imported while this tab is open.
                window.addEventListener("storage", function (e) {
                    if (e.key === "handiPackId") adjust();
                });
            })();
        </script>

                        .then(() =>

            // ========== GLOBAL TEST: alertTrigger for calendar alerts ==========
            // Pre-create AudioContext on first click so it works from console
            var _alertCtx = null;
            var _alertFlash = null;
            document.addEventListener("click", function () {
                if (!_alertCtx) {
                    try {
                        _alertCtx = new (
                            window.AudioContext || window.webkitAudioContext
                        )();
                    } catch (e) {}
                }
                if (_alertCtx && _alertCtx.state === "suspended") {
                    _alertCtx.resume().catch(function () {});
                }
                // Request notification permission on click too (browser allows this)
                if (
                    "Notification" in window &&
                    Notification.permission === "default"
                ) {
                    Notification.requestPermission();
                }
            });
            window.alertTrigger = function () {
                try {
                    // System notification
                    if (
                        "Notification" in window &&
                        Notification.permission === "granted"
                    ) {
                        new Notification("📅 TEST ALERT", {
                            body: "Calendar test — beep, notification, and screen flash.",
                            icon: "/images/favicon.png",
                        });
                    }

                    // Audio beep (needs AudioContext to exist and be running)
                    var ctx = _alertCtx;
                    if (ctx) {
                        if (ctx.state === "suspended")
                            ctx.resume().catch(function () {});
                        try {
                            var osc = ctx.createOscillator();
                            var gain = ctx.createGain();
                            osc.type = "square";
                            osc.frequency.value = 880;
                            gain.gain.value = 0.15;
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start();
                            var t = ctx.currentTime;
                            for (var p = 0; p < 10; p += 0.5) {
                                gain.gain.setValueAtTime(
                                    Math.floor(p / 0.5) % 2 === 0 ? 0.15 : 0,
                                    t + p,
                                );
                            }
                            gain.gain.setValueAtTime(0, t + 10);
                            osc.stop(t + 10);
                        } catch (e) {
                            console.warn("Beep error:", e);
                        }
                    } else {
                        console.log(
                            "ℹ️ Click on the page first to enable audio, then run alertTrigger() again.",
                        );
                    }
                } catch (e) {
                    console.warn("alertTrigger beep error:", e);
                }

                try {
                    // Screen flash — rapid red flashing until dismissed
                    var flash = document.getElementById("calAlertFlash");
                    if (!flash) {
                        flash = document.createElement("div");
                        flash.id = "calAlertFlash";
                        flash.style.cssText =
                            "position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:auto;z-index:9999;transition:none;opacity:1;background:rgba(220,0,0,0.25);";
                        document.body.appendChild(flash);
                        _alertFlash = flash;
                    }
                    flash.style.opacity = "1";
                    flash.style.pointerEvents = "auto";
                    var colors = ["rgba(220,0,0,0.25)", "rgba(220,0,0,0.50)"];
                    var ci = 0;
                    if (flash._interval) clearInterval(flash._interval);
                    flash.style.background = colors[0];
                    flash._interval = setInterval(function () {
                        ci = 1 - ci;
                        flash.style.background = colors[ci];
                    }, 400);
                    flash.onclick = window.clearAlert;
                    flash.ontouchstart = function (e) {
                        e.preventDefault();
                        window.clearAlert();
                    };
                } catch (e) {
                    console.warn("alertTrigger flash error:", e);
                }

                console.log(
                    "🔔 alertTrigger() fired — beep + red flash until dismissed",
                );
            };

            // Global clearAlert() to dismiss calendar alert
            window.clearAlert = function () {
                var flash = document.getElementById("calAlertFlash");
                if (flash) {
                    if (flash._interval) {
                        clearInterval(flash._interval);
                        flash._interval = null;
                    }
                    flash.onclick = null;
                    flash.ontouchstart = null;
                    flash.style.opacity = "0";
                    flash.style.background = "none";
                    flash.style.pointerEvents = "none";
                }
            };
        </script>

        <script>
            // Admin-built pack (builder-admin.html stamp): unlock premium modules
            window.HANDI_PACK_ADMIN = (function () {
                try {
                    return localStorage.getItem("handiPackAdmin") === "1";
                } catch (e) {
                    return false;
                }
            })();
            // Modules granted by an admin-built pack link — only these premium
            // modules are unlocked by the pack; the rest stay Premium-only.
            window.HANDI_PACK_MODULES = (function () {
                try {
                    var list = JSON.parse(
                        localStorage.getItem("handiPackModules") || "[]",
                    );
                    return Array.isArray(list) ? list : [];
                } catch (e) {
                    return [];
                }
            })();
        </script>

        <!-- ========== SUBSCRIPTION CHECK ========== -->
        <script>
            (async function () {
                const host = window.location.hostname;
                // Localhost and staging always get premium
                if (
                    host === "localhost" ||
                    host === "127.0.0.1" ||
                    host.startsWith("192.168.") ||
                    host.startsWith("staging.")
                ) {
                    window.PREMIUM_ACTIVE = true;
                    window.dispatchEvent(new Event("premiumChecked"));
                    return;
                }
                const subId = localStorage.getItem("stripe_subscription_id");
                if (!subId) {
                    window.PREMIUM_ACTIVE = false;
                    window.dispatchEvent(new Event("premiumChecked"));
                    return;
                }
                try {
                    const resp = await fetch(
                        `/api/subscription/status?subscription_id=${encodeURIComponent(subId)}`,
                    );
                    const data = await resp.json();
                    window.PREMIUM_ACTIVE = data.premium === true;
                    if (data.expiry) {
                        localStorage.setItem("premium_expiry", data.expiry);
                    }
                } catch (e) {
                    console.warn("Subscription check failed:", e);
                    window.PREMIUM_ACTIVE = false;
                }
                // Notify cleanup that premium status is known
                window.dispatchEvent(new Event("premiumChecked"));
            })();
        </script>

        <script src="js/core/module-buttons.js?v=4"></script>
        <script src="js/core/footer-controls.js"></script>

        <!-- ========== CLEANUP - shows/hides modules based on Master Module Record ========== -->
        <script>
            (function () {
                function runCleanup() {
                    try {
                        if (!window.HANDI_MODULES) {
                            setTimeout(runCleanup, 100);
                            return;
                        }

                        let mmr = window.getMMR();

                        // Premium users: lift the free-tier locks that pushed
                        // premium modules into state 2 (disabled) — otherwise
                        // they stay greyed out in Settings even after upgrade.
                        if (
                            window.PREMIUM_ACTIVE === true &&
                            window.repairPremiumMMR
                        ) {
                            window.repairPremiumMMR();
                            mmr = window.getMMR();
                        }

                        if (window.PREMIUM_ACTIVE === false) {
                            let changed = false;
                            const premiumIds = window
                                .HANDI_PREMIUM_MODULES()
                                .map((m) => m.id);
                            for (const id of premiumIds) {
                                // Registry-hidden modules (defaultEnabled 3)
                                // stay hidden — never surfaced or forced.
                                const reg = window.HANDI_MODULE_BY_ID(id);
                                if (reg && reg.defaultEnabled === 3) continue;
                                // An admin-built pack unlocks only the modules
                                // it actually included — everything else stays
                                // blocked for free users.
                                const granted =
                                    window.HANDI_PACK_ADMIN &&
                                    window.HANDI_PACK_MODULES.indexOf(id) !==
                                        -1;
                                // Support is pinned on for free users: it always
                                // shows (position 1) and its settings toggle is
                                // greyed out — only premium can turn it off.
                                // When a pack grants support it follows the pack.
                                if (id === "support") {
                                    if (granted) continue;
                                    if (mmr[id] !== 1) {
                                        mmr[id] = 1;
                                        changed = true;
                                    }
                                    continue;
                                }
                                if (granted) continue;
                                if (mmr[id] !== 2) {
                                    mmr[id] = 2;
                                    changed = true;
                                }
                            }
                            if (changed) window.saveMMR(mmr);
                        }

                        let allModules = window.HANDI_MODULE_IDS();

                        let grid = document.getElementById("dashboard-grid");
                        if (!grid) return;

                        for (let id of allModules) {
                            let el = document.getElementById(id);
                            if (!el) continue;
                            if (mmr[id] !== 1) {
                                el.remove();
                            }
                        }
                    } catch (e) {
                        console.error("[Cleanup] Error:", e);
                    }
                }

                // Try multiple times to catch the modules after they've been initialized
                runCleanup();
                document.addEventListener("DOMContentLoaded", runCleanup);
                window.addEventListener("load", function () {
                    setTimeout(runCleanup, 500);
                });
                window.addEventListener("premiumChecked", runCleanup);
                // Re-run when MMR changes in another tab
                window.addEventListener("storage", function (e) {
                    if (e.key === "handiMasterModules") {
                        location.reload();
                    }
                });
            })();

            // First visit redirect
            (function () {
                if (window.HANDI_BOT) return;
                if (localStorage.getItem("handiPopupShown") === "true") return;
                if (window.location.pathname.includes("/selector.html")) return;
                localStorage.setItem("handiPopupShown", "true");
                window.location.href = "/selector.html";
            })();
        </script>
        <!-- ========== THEME SWITCHER (paint icon in header) ========== -->
        <script>
            (function () {
                var btn = document.getElementById("themeSwitcher");
                var link = document.getElementById("theme-link");
                if (!btn || !link) return;

                var order = ["senior", "techie", "woman", "student"];
                var urls = {
                    senior: "/css/elderly.css",
                    techie: "/css/techie.css",
                    woman: "/css/woman.css",
                    student: "/css/student.css",
                };

                btn.addEventListener("click", function () {
                    var current =
                        localStorage.getItem("handiTheme") || "senior";
                    var idx = order.indexOf(current);
                    var next = order[(idx + 1) % order.length];

                    link.href = urls[next];
                    localStorage.setItem("handiTheme", next);

                    window.logEvent(2, "theme_change", {
                        from: current,
                        to: next,
                    });

                    // Pop animation for visual feedback
                    btn.classList.add("theme-switched");
                    setTimeout(function () {
                        btn.classList.remove("theme-switched");
                    }, 400);
                });
            })();
        </script>

        <script>
            (function () {
                if (!window.t) return;
                window.addEventListener("load", function () {
                    setTimeout(function () {
                        var el = document.querySelector(".customize-link a");
                        if (el)
                            el.textContent = window.t(

                                "Build Your Own Handi-homepage",

                        el = document.querySelector(".brand a");
                        if (el)
                            el.textContent = window.t(
                                "d_freeTrial",
                                "Start free trial (no credit card needed)",
                            );
                    }, 1000);
                });
            })();
        </script>
        <script>
            // Page load timing + session info
            (function () {
                var start = performance.timing
                    ? performance.timing.navigationStart
                    : Date.now();
                window.addEventListener("load", function () {
                    setTimeout(function () {
                        var loadTime = ((Date.now() - start) / 1000).toFixed(2);
                        var theme =
                            localStorage.getItem("handiTheme") || "senior";
                        var lang = localStorage.getItem("handiLang") || "en";
                        window.logEvent(1, "page_load", {
                            loadTimeSec: loadTime,
                            theme: theme,
                            lang: lang,
                        });
                    }, 500);
                });
            })();
        </script>
