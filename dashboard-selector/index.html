<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HandiHomepage – Your Safe & Simple Dashboard</title>

    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="/css/vendor/fa-7.2.0/css/all.min.css">

    <!-- Main Styles -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/elderly.css">

    <style>
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: 100%;
        }
        .search-wrapper {
            flex: 1;
            min-width: 200px;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 48px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px 4px 20px;
            box-sizing: border-box;
        }
        #searchInput {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            font-size: 18px;
        }
        #searchEngine {
            border-radius: 8px;
            padding: 6px;
            border: 1px solid #ccc;
        }
        #searchEngineLogo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: contain;
            display: block;
        }
        .search-button {
            border: none;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
        }
        .search-button:hover {
            opacity: 0.9;
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: stretch;
            }
            .site-branding { text-align: center; }
            .nav-links { width: 100%; }
            .search-wrapper { width: 100%; flex: none; }
            .header-weather { text-align: center; justify-content: center; }
        }
        @media (max-width: 550px) {
            .search-wrapper {
                flex-wrap: wrap;
                border-radius: 28px;
                padding: 12px;
                gap: 8px;
            }
            #searchInput { flex: 1 1 100%; order: 1; }
            #searchEngine { flex: 1; order: 2; }
            #searchEngineLogo { order: 3; }
            .search-button { order: 4; width: 100%; border-radius: 40px; }
        }
    </style>

    <script src="/js/vendor/his.js@latest"></script>
    <script src="/js/vendor/packery.pkgd.min.js"></script>
    <script src="/js/vendor/Sortable.min.js"></script>

    <script type="module">
        import { loadSettings } from './js/core/settings.js';
        import { startWeatherUpdates } from './js/core/weather.js';
        import initBus from './modules/bus/bus.module.js';
        import initGallery from './modules/gallery/gallery.module.js';
        import initMusic from './modules/music/music.module.js';
        import initNews from './modules/news/news.module.js';
        import initMastodon from './modules/mastodon/mastodon.module.js';
        import initRadio from './modules/radio/radio.module.js';
        import initEmergency from './modules/emergency/emergency.module.js';
        import initPhone from './modules/friendly-phone/friendly-phone.module.js';
        import initChat from './modules/chat/chat.module.js';
        import initCalendar from './modules/calendar/calendar.module.js';
        import { initLayout } from './js/core/layout.js';

        // -------------------------------------------------------------
        // 1. Load saved state from localStorage (written by dashboard selector)
        // -------------------------------------------------------------
        let settings = {};
        try {
            const stored = localStorage.getItem('handiSettings');
            if (stored) settings = JSON.parse(stored);
        } catch(e) { console.warn('Could not parse handiSettings', e); }

        // Which modules are enabled?
        let enabledModulesList = [];
        if (settings.enabledModules) {
            enabledModulesList = Object.keys(settings.enabledModules).filter(id => settings.enabledModules[id] === true);
        }

        // Default fallback (all free modules, excluding emergency)
        if (enabledModulesList.length === 0) {
            enabledModulesList = ['gallery', 'bus', 'music', 'news', 'mastodon', 'radio', 'phone', 'chat', 'calendar'];
        }

        // Module order from selector
        let moduleOrder = [];
        const savedOrder = localStorage.getItem('handiModuleOrder');
        if (savedOrder) {
            try {
                moduleOrder = JSON.parse(savedOrder);
                // Reorder enabledModulesList according to savedOrder
                const ordered = [];
                for (let id of moduleOrder) {
                    if (enabledModulesList.includes(id)) ordered.push(id);
                }
                // Append any enabled modules missing from order
                for (let id of enabledModulesList) {
                    if (!ordered.includes(id)) ordered.push(id);
                }
                enabledModulesList = ordered;
            } catch(e) { console.warn('Invalid module order', e); }
        }

        const allModuleIds = ['gallery', 'bus', 'music', 'news', 'mastodon', 'radio', 'emergency', 'phone', 'chat', 'calendar'];
        const grid = document.getElementById('dashboard-grid');

        // -------------------------------------------------------------
        // 2. Reorder DOM elements and hide disabled modules
        // -------------------------------------------------------------
        if (grid) {
            // Move enabled modules in correct order
            for (let id of enabledModulesList) {
                const el = document.getElementById(id);
                if (el) grid.appendChild(el);
            }
            // Move disabled modules (they will be hidden)
            for (let id of allModuleIds) {
                if (!enabledModulesList.includes(id)) {
                    const el = document.getElementById(id);
                    if (el) grid.appendChild(el);
                }
            }
            // Apply hidden class
            for (let id of allModuleIds) {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('hidden', !enabledModulesList.includes(id));
            }
        }

        // -------------------------------------------------------------
        // 3. Initialize only enabled modules
        // -------------------------------------------------------------
        const modules = {
            gallery: initGallery,
            bus: initBus,
            music: initMusic,
            news: initNews,
            mastodon: initMastodon,
            radio: initRadio,
            emergency: initEmergency,
            phone: initPhone,
            chat: initChat,
            calendar: initCalendar
        };

        for (const [id, initFn] of Object.entries(modules)) {
            const element = document.getElementById(id);
            if (!element) continue;
            const isEnabled = enabledModulesList.includes(id);
            if (isEnabled) {
                const container = element.querySelector('.module-content');
                if (container) {
                    try {
                        initFn(container);
                    } catch (err) {
                        console.error(`Error initialising ${id}:`, err);
                    }
                }
            }
        }

        initLayout();

        // -------------------------------------------------------------
        // 4. Search functionality
        // -------------------------------------------------------------
        function initializeSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchEngine = document.getElementById('searchEngine');
            const searchEngineLogo = document.getElementById('searchEngineLogo');
            const searchButton = document.getElementById('searchButton');
            if (!searchInput || !searchEngine || !searchEngineLogo) return;

            const logoMap = {
                startpage: { name: 'Startpage', url: '/images/startpage.jpg' },
                qwant: { name: 'Qwant', url: '/images/qwant.jpg' },
                ecosia: { name: 'Ecosia', url: '/images/ecosia.jpg' },
                mojeek: { name: 'Mojeek', url: '/images/mojeek.jpg' }
            };

            function updateSearchLogo(value) {
                const engine = logoMap[value] || logoMap.startpage;
                searchEngineLogo.src = engine.url;
                searchEngineLogo.onerror = () => {
                    searchEngineLogo.src = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="100%" height="100%" rx="8" fill="#5c6cff"/><text x="50%" y="55%" text-anchor="middle" fill="white" font-size="18" font-family="Arial">🔍</text></svg>`);
                };
            }
            updateSearchLogo(searchEngine.value);
            searchEngine.addEventListener('change', () => updateSearchLogo(searchEngine.value));

            function performSearch() {
                const query = searchInput.value.trim();
                if (!query) return;
                const urls = {
                    startpage: `https://www.startpage.com/sp/search?query=${encodeURIComponent(query)}`,
                    qwant: `https://www.qwant.com/?q=${encodeURIComponent(query)}`,
                    ecosia: `https://www.ecosia.org/search?q=${encodeURIComponent(query)}`,
                    mojeek: `https://www.mojeek.com/search?q=${encodeURIComponent(query)}`
                };
                window.open(urls[searchEngine.value] || urls.startpage, '_blank');
            }
            searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
            if (searchButton) searchButton.addEventListener('click', performSearch);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initializeSearch);
        else initializeSearch();

        // -------------------------------------------------------------
        // 5. Weather (only if enabled)
        // -------------------------------------------------------------
        if (settings.enabledModules?.weather !== false) {
            startWeatherUpdates();
        } else {
            const weatherDiv = document.querySelector('.header-weather');
            if (weatherDiv) weatherDiv.style.display = 'none';
        }
    </script>
</head>
<body>

<script src="js/core/message.js"></script>

<header>
    <div class="site-branding">
        <div class="handi-logo">
            <a href="/" class="logo-link">
                <i class="fa-solid fa-hand-peace"></i>
                <span class="logo-text">HandiHomepage</span>
            </a>
        </div>
    </div>
    <div class="nav-links">
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Search privately...">
            <select id="searchEngine">
                <option value="startpage">Startpage</option>
                <option value="qwant">Qwant</option>
                <option value="ecosia">Ecosia</option>
                <option value="mojeek">Mojeek</option>
            </select>
            <img id="searchEngineLogo" src="/images/startpage.jpg" alt="Startpage" title="Startpage">
            <button id="searchButton" class="search-button"><i class="fas fa-arrow-right"></i></button>
        </div>
    </div>
    <div class="header-weather">
        <i class="fa-solid fa-cloud-sun"></i>
        <span id="weather">🌤️ --°C</span>
    </div>
</header>

<div class="dashboard-wrapper">
    <main id="dashboard-grid">
        <div id="gallery" class="dashboard-item module"><div class="module-content"></div></div>
        <div id="bus" class="dashboard-item module"><div class="module-content"></div></div>
        <div id="music" class="dashboard-item module"><div class="module-content"></div></div>
        <div id="news" class="dashboard-item module"><div class="module-content"></div></div>
        <div id="mastodon" class="dashboard-item module"><div class="module-content"></div></div>
        <div id="radio" class="dashboard-item module"><div class="module-content"></div></div>
        <div id="emergency" class="dashboard-item module"><div class="module-content"></div></div>
        <div id="phone" class="dashboard-item module"><div class="module-content"></div></div>
        <div id="chat" class="dashboard-item module"><div class="module-content"></div></div>
        <div id="calendar" class="dashboard-item module"><div class="module-content"></div></div>
    </main>
</div>

<footer>
    <div class="footer-bar">
        <button id="footerMuteBtn" class="footer-icon"><i class="fa-solid fa-volume-high"></i></button>
        <button id="footerWakeLockBtn" class="footer-icon"><i class="fa-solid fa-bed"></i></button>
        <button id="footerDocsBtn" class="footer-icon"><i class="fa-solid fa-question"></i></button>
        <button id="footerCoffeeBtn" class="footer-icon"><i class="fa-solid fa-beer"></i></button>
        <button id="footerEmailBtn" class="footer-icon"><i class="fa-solid fa-at"></i></button>
        <button id="footerSettingsBtn" class="footer-icon"><i class="fa-solid fa-gear"></i></button>
    </div>
</footer>

<div class="brand">
    <span class="subtitle">
        <a href="https://handihomepage.com/terms">Terms of Service</a> |
        <a href="https://handihomepage.com/privacy">Privacy Policy</a>
    </span>
</div>

<script src="js/core/module-buttons.js"></script>
<script src="js/core/footer-controls.js"></script>
<script src="js/core/first-popup.js"></script>
<!-- first-popup.js is removed – replaced by the dashboard selector -->
</body>
</html>
