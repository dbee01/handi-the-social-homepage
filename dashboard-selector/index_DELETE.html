<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dashboard Modules - HandiHomepage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #e9ecef;
            padding: 30px;
        }

        /* Main container - two column layout */
        .dashboard-app {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Two column layout */
        .dashboard-layout {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        /* LEFT PANEL - Selector */
        .selector-panel {
            flex: 1;
            min-width: 320px;
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .selector-panel h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #1a1a2e;
        }

        .selector-sub {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e9ecef;
        }

        /* Module groups */
        .module-group {
            margin-bottom: 28px;
        }

        .group-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .free-title {
            color: #2c7a4d;
        }

        .premium-title {
            color: #e67e22;
        }

        .premium-icon {
            background: #ff9800;
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
        }

        /* Module list */
        .modules-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .module-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #e9ecef;
            transition: all 0.2s;
        }

        .premium-module {
            background: #fffaf2;
            border-left: 3px solid #ff9800;
        }

        .module-info h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .module-info p {
            font-size: 11px;
            color: #6c757d;
        }

        .premium-label {
            background: #ff9800;
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
        }

        /* Buttons */
        .toggle-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        .btn-add {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .btn-remove {
            background: #ffebee;
            color: #c62828;
        }

        /* RIGHT PANEL - Dashboard */
        .dashboard-panel {
            flex: 1.2;
            min-width: 380px;
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .dashboard-header h2 {
            font-size: 20px;
            color: #1a1a2e;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .reset-btn {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        .apply-btn {
            background: #2c7a4d;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        /* Dashboard list */
        .dashboard-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 400px;
        }

        .dashboard-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #e9ecef;
            cursor: grab;
        }

        .dashboard-item:active {
            cursor: grabbing;
        }

        .drag-handle {
            cursor: grab;
            margin-right: 12px;
            color: #adb5bd;
            font-size: 18px;
        }

        .item-content {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-icon {
            font-size: 24px;
        }

        .item-info strong {
            font-size: 15px;
        }

        .item-info p {
            font-size: 11px;
            color: #6c757d;
            margin-top: 2px;
        }

        .premium-dash-badge {
            background: #ff9800;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
            color: white;
        }

        .remove-dash {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #adb5bd;
            padding: 4px 8px;
        }

        .remove-dash:hover {
            color: #c62828;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #adb5bd;
        }

        /* Footer consent */
        .footer-consent {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #6c757d;
        }

        hr {
            margin: 16px 0;
            border-color: #e9ecef;
        }
    </style>
</head>
<body>
<div class="dashboard-app">
    <div class="dashboard-layout">
        <!-- LEFT PANEL: MODULE SELECTOR -->
        <div class="selector-panel">
            <h2>📦 Module Library</h2>
            <div class="selector-sub">Click + / - to add/remove modules</div>

            <!-- FREE MODULES -->
            <div class="module-group">
                <div class="group-title free-title">🆓 FREE MODULES</div>
                <div id="freeModulesList" class="modules-list"></div>
            </div>

            <!-- PREMIUM MODULES -->
            <div class="module-group">
                <div class="group-title premium-title">
                    💎 PREMIUM MODULES
                    <span class="premium-icon">✦ PREMIUM ✦</span>
                </div>
                <div id="premiumModulesList" class="modules-list"></div>
            </div>

            <!-- CONSENT -->
            <div style="margin-top: 20px; padding: 12px; background: #f8f9fa; border-radius: 12px;">
                <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer;">
                    <input type="checkbox" id="privacyConsent"> I agree to the Privacy Policy
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="termsConsent"> I agree to the Terms & Conditions
                </label>
            </div>
        </div>

        <!-- RIGHT PANEL: YOUR DASHBOARD -->
        <div class="dashboard-panel">
            <div class="dashboard-header">
                <h2>📌 Your Dashboard</h2>
                <div class="action-buttons">
                    <button id="resetBtn" class="reset-btn">⟳ Reset All</button>
                    <button id="applyBtn" class="apply-btn">✓ Apply to dashboard</button>
                </div>
            </div>
            <div id="dashboardList" class="dashboard-list"></div>
            <div id="emptyMsg" class="empty-state" style="display: none;">✨ No modules yet — click + on any module to add ✨</div>
        </div>
    </div>
    <div class="footer-consent">
        🔒 Premium modules require accepting Terms & Privacy Policy
    </div>
</div>

<script>
    // ========== MODULE DATABASE ==========
    const FREE_MODULES = [
        { id: "gallery", name: "Gallery", icon: "🖼️", desc: "Photos & memories" },
        { id: "bus", name: "Bus Tracker", icon: "🚌", desc: "Live transit times" },
        { id: "music", name: "Music Player", icon: "🎵", desc: "Your playlists" },
        { id: "news", name: "News", icon: "📰", desc: "Top headlines" },
        { id: "weather", name: "Weather", icon: "🌤️", desc: "Forecast & radar" },
        { id: "calendar", name: "Calendar", icon: "📅", desc: "Events & reminders" },
        { id: "tasks", name: "Tasks", icon: "✓", desc: "To-do list" }
    ];

    const PREMIUM_MODULES = [
        { id: "webrtc", name: "Free Calls", icon: "📱", desc: "Free VoIP & international calls" },
        { id: "live_bus", name: "Live Bus Tracker", icon: "🚌", desc: "Real-time transit & routes" },
        { id: "emergency_alert", name: "Emergency Alert", icon: "⚠️", desc: "Critical notifications & safety" }
    ];

    const ALL_MODULES = [...FREE_MODULES, ...PREMIUM_MODULES];

    // ========== STORAGE ==========
    function getEnabled() {
        let s = localStorage.getItem('handiSettings');
        if (!s) return {};
        try {
            let settings = JSON.parse(s);
            return settings.enabledModules || {};
        } catch(e) { return {}; }
    }

    function saveEnabled(enabled) {
        let s = localStorage.getItem('handiSettings');
        let settings = s ? JSON.parse(s) : {};
        settings.enabledModules = enabled;
        localStorage.setItem('handiSettings', JSON.stringify(settings));
    }

    function hasConsent() {
        let p = document.getElementById('privacyConsent');
        let t = document.getElementById('termsConsent');
        return p && p.checked && t && t.checked;
    }

    // ========== RENDER SELECTOR ==========
    function renderSelector() {
        let enabled = getEnabled();
        let consent = hasConsent();

        // FREE modules
        let freeContainer = document.getElementById('freeModulesList');
        if (freeContainer) {
            freeContainer.innerHTML = '';
            FREE_MODULES.forEach(mod => {
                let isActive = enabled[mod.id] === true;
                let div = document.createElement('div');
                div.className = 'module-item';
                div.innerHTML = `
                    <div class="module-info">
                        <h4>${mod.icon} ${mod.name}</h4>
                        <p>${mod.desc}</p>
                    </div>
                    <button class="toggle-btn ${isActive ? 'btn-remove' : 'btn-add'}">${isActive ? '✖ Remove' : '+ Add'}</button>
                `;
                let btn = div.querySelector('button');
                btn.onclick = () => {
                    if (isActive) {
                        delete enabled[mod.id];
                    } else {
                        enabled[mod.id] = true;
                    }
                    saveEnabled(enabled);
                    renderSelector();
                    renderDashboard();
                };
                freeContainer.appendChild(div);
            });
        }

        // PREMIUM modules
        let premiumContainer = document.getElementById('premiumModulesList');
        if (premiumContainer) {
            premiumContainer.innerHTML = '';
            PREMIUM_MODULES.forEach(mod => {
                let isActive = enabled[mod.id] === true;
                let div = document.createElement('div');
                div.className = 'module-item premium-module';
                div.innerHTML = `
                    <div class="module-info">
                        <h4>${mod.icon} ${mod.name} <span class="premium-label">PREMIUM</span></h4>
                        <p>${mod.desc}</p>
                    </div>
                    <button class="toggle-btn ${isActive ? 'btn-remove' : 'btn-add'}">${isActive ? '✖ Remove' : '+ Add'}</button>
                `;
                let btn = div.querySelector('button');
                btn.onclick = () => {
                    if (!consent) {
                        alert('⚠️ Please accept Privacy Policy and Terms to modify Premium modules.');
                        return;
                    }
                    if (isActive) {
                        delete enabled[mod.id];
                    } else {
                        enabled[mod.id] = true;
                    }
                    saveEnabled(enabled);
                    renderSelector();
                    renderDashboard();
                };
                premiumContainer.appendChild(div);
            });
        }
    }

    // ========== RENDER DASHBOARD ==========
    function renderDashboard() {
        let enabled = getEnabled();
        let activeIds = Object.keys(enabled).filter(k => enabled[k] === true);
        let activeModules = activeIds.map(id => ALL_MODULES.find(m => m.id === id)).filter(m => m);

        let container = document.getElementById('dashboardList');
        let emptyMsg = document.getElementById('emptyMsg');

        if (activeModules.length === 0) {
            container.innerHTML = '';
            if (emptyMsg) emptyMsg.style.display = 'block';
            return;
        }
        if (emptyMsg) emptyMsg.style.display = 'none';

        container.innerHTML = '';
        activeModules.forEach((mod, idx) => {
            let isPremium = PREMIUM_MODULES.some(p => p.id === mod.id);
            let div = document.createElement('div');
            div.className = 'dashboard-item';
            div.setAttribute('draggable', 'true');
            div.setAttribute('data-index', idx);
            div.innerHTML = `
                <div style="display: flex; align-items: center; width: 100%;">
                    <span class="drag-handle">⋮⋮</span>
                    <div class="item-content">
                        <span class="item-icon">${mod.icon}</span>
                        <div class="item-info">
                            <strong>${mod.name} ${isPremium ? '<span class="premium-dash-badge">PREMIUM</span>' : ''}</strong>
                            <p>${mod.desc}</p>
                        </div>
                    </div>
                    <button class="remove-dash">🗑️</button>
                </div>
            `;

            // Remove handler
            let removeBtn = div.querySelector('.remove-dash');
            removeBtn.onclick = () => {
                if (isPremium && !hasConsent()) {
                    alert('⚠️ Please accept Privacy Policy and Terms to remove premium modules.');
                    return;
                }
                let enabled = getEnabled();
                delete enabled[mod.id];
                saveEnabled(enabled);
                renderSelector();
                renderDashboard();
            };

            // Drag and drop
            div.ondragstart = (e) => {
                e.dataTransfer.setData('text/plain', idx);
                div.style.opacity = '0.5';
            };
            div.ondragend = () => {
                div.style.opacity = '1';
            };
            div.ondragover = (e) => {
                e.preventDefault();
            };
            div.ondrop = (e) => {
                e.preventDefault();
                let fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
                let toIdx = idx;
                if (fromIdx !== toIdx) {
                    let enabled = getEnabled();
                    let active = Object.keys(enabled).filter(k => enabled[k] === true);
                    let [moved] = active.splice(fromIdx, 1);
                    active.splice(toIdx, 0, moved);
                    let newEnabled = {};
                    active.forEach(id => { newEnabled[id] = true; });
                    saveEnabled(newEnabled);
                    renderSelector();
                    renderDashboard();
                }
            };

            container.appendChild(div);
        });
    }

    // ========== ACTIONS ==========
    function resetModules() {
        if (!hasConsent()) {
            alert('⚠️ Please accept Privacy Policy and Terms to reset.');
            return;
        }
        let defaults = {
            gallery: true, bus: true, music: true, news: true,
            weather: true, calendar: true, tasks: true
        };
        saveEnabled(defaults);
        renderSelector();
        renderDashboard();
        alert('Reset complete!');
    }

    function applyChanges() {
        if (!hasConsent()) {
            alert('⚠️ Please accept Privacy Policy and Terms to apply.');
            return;
        }
        saveEnabled(getEnabled());
        alert('✓ Dashboard applied!');
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'modulesUpdated' }, '*');
        }
    }

    // ========== INIT ==========
    renderSelector();
    renderDashboard();

    document.getElementById('resetBtn')?.addEventListener('click', resetModules);
    document.getElementById('applyBtn')?.addEventListener('click', applyChanges);
    document.getElementById('privacyConsent')?.addEventListener('change', () => {
        renderSelector();
        renderDashboard();
    });
    document.getElementById('termsConsent')?.addEventListener('change', () => {
        renderSelector();
        renderDashboard();
    });
</script>
</body>
</html>
