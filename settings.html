<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ple.ie - Settings</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="styles/settings.css">
</head>
<body>
<div class="settings-page">
<div class="settings-header">
<h1><i class="fa-solid fa-sliders-h"></i> Module Settings</h1>
<div class="header-buttons">
<button class="save-settings-top" id="saveBtn">Save Settings</button>
<button class="back-btn" id="backBtn">Back to Dashboard</button>
</div>
</div>

<!-- Gallery Module -->
<div class="module-section">
<div class="module-header">
<div class="enable-toggle" data-module="gallery"><div class="toggle-slider"></div></div>
<h3><i class="fa-solid fa-images"></i> Gallery Module</h3>
<i class="fa-solid fa-chevron-down"></i>
</div>
<div class="module-config">
<div class="config-field">
<label>Image Folder</label>
<input type="text" id="galleryFolderPath" readonly placeholder="No folder selected">
<button class="select-folder-btn" id="selectGalleryBtn">Select Folder</button>
</div>
<div class="config-field">
<label>Slideshow Speed (ms):</label>
<input type="number" id="gallerySpeed" value="3000">
</div>
<div id="galleryStorageInfo" class="storage-info">0 images stored</div>
</div>
</div>

<!-- Bus Module -->
<div class="module-section">
<div class="module-header">
<div class="enable-toggle" data-module="bus"><div class="toggle-slider"></div></div>
<h3><i class="fa-solid fa-bus"></i> Bus Module</h3>
<i class="fa-solid fa-chevron-down"></i>
</div>
<div class="module-config">
<div class="config-field">
<label><i class="fa-solid fa-route"></i> Route IDs (comma-separated):</label>
<input type="text" id="busRouteIds" placeholder="e.g., 223, 215">
</div>
<div class="config-field">
<label><i class="fa-solid fa-map-marker-alt"></i> Stop IDs (comma-separated):</label>
<input type="text" id="busStopIds" placeholder="e.g., 242081, 242051">
</div>
</div>
</div>

<!-- Music Player Module -->
<div class="module-section">
<div class="module-header">
<div class="enable-toggle" data-module="local-player"><div class="toggle-slider"></div></div>
<h3><i class="fa-solid fa-music"></i> Music Player</h3>
<i class="fa-solid fa-chevron-down"></i>
</div>
<div class="module-config">
<div class="config-field">
<label>Music Folder</label>
<input type="text" id="musicFolderPath" readonly placeholder="No folder selected">
<button class="select-folder-btn" id="selectMusicBtn">Select Folder</button>
</div>
<div class="config-field">
<label>Default Volume (%):</label>
<input type="range" id="defaultVolume" min="0" max="100" value="70">
<span id="volumeValue">70%</span>
</div>
<div id="musicStorageInfo" class="storage-info">0 music files stored</div>
</div>
</div>

<!-- News Module -->
<div class="module-section">
<div class="module-header">
<div class="enable-toggle" data-module="news"><div class="toggle-slider"></div></div>
<h3><i class="fa-solid fa-newspaper"></i> News Module</h3>
<i class="fa-solid fa-chevron-down"></i>
</div>
<div class="module-config">
<div class="config-field">
<label>Select RSS Feed</label>
<div id="rssFeedList" class="feed-list"></div>
</div>
</div>
</div>

<!-- Emergency Module -->
<div class="module-section">
<div class="module-header">
<div class="enable-toggle" data-module="emergency"><div class="toggle-slider"></div></div>
<h3><i class="fa-solid fa-triangle-exclamation"></i> Emergency Module</h3>
<i class="fa-solid fa-chevron-down"></i>
</div>
<div class="module-config">
<div class="config-field">
<label>Emergency Contacts</label>
<div id="emergencyContactsList" class="contact-list">No contacts saved</div>
<button class="add-contact-btn" id="addEmergencyBtn">Add Contact</button>
</div>
</div>
</div>

<!-- Friendly Phone Module -->
<div class="module-section">
<div class="module-header">
<div class="enable-toggle" data-module="friendly-phone"><div class="toggle-slider"></div></div>
<h3><i class="fa-solid fa-phone"></i> Friendly Phone</h3>
<i class="fa-solid fa-chevron-down"></i>
</div>
<div class="module-config">
<div class="config-field">
<label>Phone Contacts</label>
<div id="phoneContactsList" class="contact-list">No contacts saved</div>
<button class="add-contact-btn" id="addPhoneBtn">Add Contact</button>
</div>
</div>
</div>
</div>

<script type="module" src="js/settings.js"></script>
</body>
</html>
