<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - ple.ie</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>
<div class="settings-container">
    <div class="header">
        <h1>Settings</h1>
        <div class="header-buttons">
            <button class="save-btn" id="saveBtn">Save Settings</button>
            <button class="reset-btn" id="resetBtn">⟳ Reset All</button>
            <button class="exit-btn" id="exitBtn">Exit</button>
        </div>
    </div>

    <!-- Gallery Module -->
    <div class="module-card">
        <div class="module-header" data-module="gallery">
            <div class="module-title"><i class="fa-solid fa-images"></i><h3>Gallery</h3></div>
            <div class="toggle-switch"><div class="toggle-slider"></div></div>
        </div>
        <div class="module-config">
            <div class="config-field"><label>Slideshow speed (ms):</label><input type="number" id="gallerySpeed" value="3000" step="100"></div>
            <div class="config-field"><label>Auto-start slideshow:</label><select id="galleryAutoStart"><option value="true">Yes</option><option value="false">No</option></select></div>
            <button id="uploadGalleryBtn" class="upload-btn">📸 Upload New Images</button>
            <div class="config-field"><label>Rename image filenames in caption format eg: My+Lovely+Horse.jpg -> displayed as -> My Lovely Horse</label></div>
        </div>
    </div>

    <!-- Music Player Module -->
    <div class="module-card">
        <div class="module-header" data-module="music">
            <div class="module-title"><i class="fa-solid fa-music"></i><h3>Music Player</h3></div>
            <div class="toggle-switch"><div class="toggle-slider"></div></div>
        </div>
        <div class="module-config">
            <div class="config-field"><label>Default volume (%):</label><input type="range" id="musicVolume" min="0" max="100" value="70"><span id="volumeValue">70%</span></div>
            <div class="config-field"><label>Default shuffle:</label><select id="musicShuffle"><option value="false">Off</option><option value="true">On</option></select></div>
            <button id="uploadMusicBtn" class="upload-btn">🎵 Upload Music Files</button>
        </div>
    </div>

    <!-- News Module -->
    <div class="module-card">
        <div class="module-header" data-module="news">
            <div class="module-title"><i class="fa-solid fa-newspaper"></i><h3>News</h3></div>
            <div class="toggle-switch"><div class="toggle-slider"></div></div>
        </div>
        <div class="module-config">
            <div class="config-field">
                <label>RSS Feed:</label>
                <select id="newsRssUrl">
                    <option value="https://www.rte.ie/feeds/rss/?index=/news/">RTÉ News</option>
                    <option value="https://www.irishexaminer.com/feed/35-top_news.xml">Irish Examiner</option>
                    <option value="https://www.irishnews.com/arc/outboundfeeds/rss/">Irish News</option>
                    <option value="https://www.thejournal.ie/feed/">The Journal</option>
                    <option value="https://feeds.feedburner.com/bnireland">BreakingNews.ie</option>
                    <option value="https://www.munster-express.ie/feed/">Munster Express</option>
                    <option value="https://www.donegaldaily.com/feed/">Donegal Daily</option>
                    <option value="https://www.limerickleader.ie/rss.jsp?sezione=1">Limerick Leader</option>
                    <option value="https://totallydublin.ie/feed/">Totally Dublin</option>
                    <option value="https://ittn.ie/feed/">Irish Tech News</option>
                </select>
            </div>
            <div class="config-field"><label>Refresh interval (minutes):</label><input type="number" id="newsRefresh" min="5" max="120" value="15"></div>
            <div class="config-field"><label>Max articles:</label><input type="number" id="newsMaxArticles" min="4" max="50" value="4"></div>
        </div>
    </div>

    <!-- Mastodon Module -->
    <div class="module-card">
        <div class="module-header" data-module="mastodon">
            <div class="module-title"><i class="fa-brands fa-mastodon"></i><h3>Mastodon Social Media</h3></div>
            <div class="toggle-switch"><div class="toggle-slider"></div></div>
        </div>
        <div class="module-config">
            <div class="config-field"><label>Instance URL:</label><input type="url" id="mastodonInstance" placeholder="https://mastodon.ie"></div>
            <div class="config-field"><label>Trending limit:</label><input type="number" id="mastodonLimit" min="4" max="20" value="4"></div>
        </div>
    </div>

    <!-- Friendly Phone Module -->
    <div class="module-card">
        <div class="module-header" data-module="phone">
            <div class="module-title"><i class="fa-solid fa-phone"></i><h3>Friendly Phone</h3></div>
            <div class="toggle-switch"><div class="toggle-slider"></div></div>
        </div>
        <div class="module-config">
            <div class="config-field"><label>Phone Contacts</label><div id="phoneContactsList" class="contact-list"></div></div>
            <div style="display: flex; gap: 8px; margin-top: 8px; margin-bottom: 16px; flex-wrap: wrap;">
                <input type="text" id="phoneName" placeholder="Name" style="flex:1;">
                <input type="tel" id="phoneNumber" placeholder="Phone" style="flex:1;">
                <input type="file" id="phonePhoto" accept="image/*" style="flex:0.5;">
                <button id="addPhoneInline" class="add-contact-btn">+ Add</button>
            </div>
            <div class="config-field"><label>Auto-dial warning (seconds):</label><input type="number" id="autoDialDelay" min="5" max="30" value="10"></div>
        </div>
    </div>

    <!-- PREMIUM MODULES -->
    <div class="header">
        <h2>Premium Modules</h2>
    </div>

    <!-- Bus Module -->
    <div class="module-card">
        <div class="module-header" data-module="bus">
            <div class="module-title"><i class="fa-solid fa-bus"></i><h3>Live Bus Tracker</h3></div>
            <div class="toggle-switch"><div class="toggle-slider"></div></div>
        </div>
        <div class="module-config">
            <div class="config-field"><label>Route IDs (comma-separated):</label><input type="text" id="busRouteIds" placeholder="e.g., 223, 215"></div>
            <div class="config-field"><label>Stop IDs (comma-separated):</label><input type="text" id="busStopIds" placeholder="e.g., 242081, 242051"></div>
        </div>
    </div>

    <!-- Emergency Module -->
    <div class="module-card">
        <div class="module-header" data-module="emergency">
            <div class="module-title"><i class="fa-solid fa-triangle-exclamation"></i><h3>Emergency Location Button</h3></div>
            <div class="toggle-switch"><div class="toggle-slider"></div></div>
        </div>
        <div class="module-config">
            <div class="config-field"><label>Emergency Contacts</label><div id="emergencyContactsList" class="contact-list"></div></div>
            <div style="display: flex; gap: 8px; margin-top: 8px; margin-bottom: 16px; flex-wrap: wrap;">
                <input type="text" id="emergencyName" placeholder="Name" style="flex:1;">
                <input type="tel" id="emergencyPhone" placeholder="Phone" style="flex:1;">
                <input type="file" id="emergencyPhoto" accept="image/*" style="flex:0.5;">
                <button id="addEmergencyInline" class="add-contact-btn">+ Add</button>
            </div>
            <div class="config-field"><label>Check interval (minutes):</label><input type="number" id="emergencyInterval" min="1" max="60" value="5"></div>
        </div>
        <div>
            <div class="brand">
                <span class="subtitle"><a href="https://handihomepage.com/terms">Terms of Service</a> | <a href="https://handihomepage.com/privacy">Privacy Policy</a></span>
            </div>
        </div>
    </div>
</div>
<script type="module" src="js/settings-app.js"></script>
</body>
</html>
